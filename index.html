<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>地獄賽馬 · Hellbred Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
  :root {
    /* Lospec Resurrect-64（精選 13 色） — 後續 Step 2/3 禁止再寫裸 hex，只用語意別名或 --c-N */
    --c-0:  #2e222f;
    --c-1:  #3e3546;
    --c-2:  #625565;
    --c-3:  #966c6c;
    --c-4:  #ab947a;
    --c-5:  #8b9bb4;
    --c-6:  #c0cbdc;
    --c-7:  #f2ae99;
    --c-8:  #ad2f45;
    --c-9:  #ea4f36;
    --c-10: #f9c22b;
    --c-11: #e8c170;
    --c-12: #3ca370;

    /* 語意別名 */
    --bg: var(--c-0);
    --bg-card: var(--c-1);
    --border: var(--c-2);
    --text: var(--c-6);
    --text-dim: var(--c-5);
    --accent: var(--c-8);
    --accent-hover: var(--c-9);
    --gold: var(--c-10);
    --foal: var(--c-3);
    --peak: var(--c-12);
    --retired: var(--c-11);
    --male: var(--c-5);
    --female: var(--c-7);

    /* Design tokens — Step 2/3 直接套用，禁止再寫 magic shadow */
    --raise: inset 0 -3px 0 rgba(0,0,0,.35);
    --raise-sm: inset 0 -2px 0 rgba(0,0,0,.3);
    --drop: 0 2px 0 rgba(0,0,0,.4);
    --drop-lg: 0 3px 0 rgba(0,0,0,.5);
    --ease-snap: cubic-bezier(.36,.07,.19,.97);

    /* Typography */
    --font-mono: 'VT323', ui-monospace, 'SF Mono', 'PingFang TC', 'Noto Sans TC', monospace;
    --font-body: 'PingFang TC', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 32px 24px;
    line-height: 1.5;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 920px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.18em;
    text-shadow: 2px 2px 0 rgba(0,0,0,.6);
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.15em;
  }

  .top-bar {
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 18px 22px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    box-shadow: var(--raise-sm), var(--drop);
  }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.4em;
    padding-left: 2px;
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 32px;
    line-height: 1;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .stat-value.gold { color: var(--gold); }
  .stat-sub {
    font-family: var(--font-mono);
    font-size: 16px;
    color: var(--text-dim);
    line-height: 1;
    margin-top: 2px;
  }

  button.primary {
    margin-left: auto;
    padding: 13px 24px 16px;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--c-9);
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.2em;
    transition: background 0.15s var(--ease-snap),
                transform 0.08s var(--ease-snap),
                box-shadow 0.08s var(--ease-snap);
    box-shadow: var(--raise), var(--drop-lg);
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: var(--raise-sm), 0 1px 0 rgba(0,0,0,.5);
  }
  button.primary:disabled {
    background: var(--c-2);
    border-color: var(--c-2);
    cursor: not-allowed;
    color: var(--text-dim);
    box-shadow: var(--raise-sm);
  }

  .section-title {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.4em;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  .horse-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .horse-list > .empty { grid-column: 1 / -1; }
  .horse-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: var(--raise-sm), var(--drop);
  }
  .horse-info { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .horse-name-row { display: flex; align-items: center; gap: 12px; }
  .horse-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .gender {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 2px;
    background: rgba(0,0,0,.35);
    font-weight: 700;
    letter-spacing: 0.1em;
    box-shadow: var(--raise-sm);
  }
  .gender.male { color: var(--male); }
  .gender.female { color: var(--female); }

  .stats-row {
    display: flex;
    gap: 22px;
    align-items: baseline;
  }
  .stat-pill {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.15em;
  }
  .stat-pill strong {
    font-family: var(--font-mono);
    font-size: 19px;
    color: var(--text);
    font-weight: 400;
    margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }

  .horse-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }
  .age {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text);
  }
  .status {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 2px;
    letter-spacing: 0.25em;
    font-weight: 700;
    box-shadow: var(--raise-sm);
  }
  .status.foal { background: var(--foal); color: var(--c-0); }
  .status.peak { background: var(--peak); color: var(--c-0); }
  .status.retired { background: var(--retired); color: var(--c-0); }

  .empty {
    padding: 36px;
    text-align: center;
    color: var(--text-dim);
    background: var(--bg-card);
    border: 1px dashed var(--border);
    border-radius: 4px;
  }

  .log {
    margin-top: 20px;
    padding: 14px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 16px;
    color: var(--text-dim);
    max-height: 180px;
    overflow-y: auto;
    box-shadow: var(--raise-sm);
    line-height: 1.4;
  }
  .log-entry { padding: 1px 0; }
  .log-entry.death { color: var(--accent-hover); }

  .info-toggle-wrap {
    margin: 22px 0 18px;
  }
  .info-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: rgba(0,0,0,.18);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    box-shadow: var(--raise-sm), var(--drop);
    transition: border-color 0.12s var(--ease-snap),
                background 0.12s var(--ease-snap),
                transform 0.08s var(--ease-snap);
  }
  .info-toggle:hover {
    border-color: var(--text-dim);
    background: rgba(0,0,0,.28);
  }
  .info-toggle:active {
    transform: translateY(2px);
    box-shadow: var(--raise-sm);
  }
  .info-toggle.open {
    border-color: var(--c-5);
    background: rgba(139,155,180,.12);
  }
  .info-toggle-icon {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.22);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 6px;
  }
  .info-toggle-icon span {
    border: 2px solid rgba(255,255,255,.85);
    border-radius: 2px;
  }
  .info-toggle-copy {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .info-toggle-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--text-dim);
  }
  .info-toggle-sub {
    font-size: 12px;
    color: var(--text);
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info-toggle-state {
    font-size: 11px;
    color: var(--c-5);
    letter-spacing: 0.25em;
    white-space: nowrap;
  }
  .info-drawer {
    display: none;
    margin-bottom: 24px;
    padding: 18px;
    background: rgba(62,53,70,.45);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: var(--raise-sm), var(--drop);
  }
  .info-drawer.open {
    display: block;
    animation: info-drawer-open 0.18s ease;
  }
  @keyframes info-drawer-open {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .info-drawer-stack {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .info-drawer .log {
    margin-top: 0;
  }

  /* 賽事播報 */
  .race-feed {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 24px;
  }
  .race-empty {
    padding: 18px;
    text-align: center;
    color: var(--text-dim);
    border: 1px dashed var(--border);
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
  .race-entry {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    padding: 10px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left-width: 3px;
    border-radius: 4px;
    align-items: baseline;
    box-shadow: var(--raise-sm);
  }
  .race-entry.win { border-left-color: var(--peak); }
  .race-entry.loss { border-left-color: var(--accent); }
  .race-year {
    font-family: var(--font-mono);
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .race-matchup {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 17px;
    color: var(--text);
    min-width: 0;
  }
  .race-matchup .player { color: var(--gold); font-weight: 700; }
  .race-matchup .enemy { color: var(--text-dim); }
  .race-matchup .score {
    font-size: 14px;
    color: var(--text-dim);
    margin-left: 4px;
  }
  .race-matchup .vs {
    color: var(--text-dim);
    margin: 0 8px;
    font-size: 13px;
    letter-spacing: 0.2em;
    font-family: var(--font-body);
  }
  .race-verdict {
    font-size: 11px;
    padding: 3px 12px;
    border-radius: 2px;
    letter-spacing: 0.3em;
    font-weight: 700;
    box-shadow: var(--raise-sm);
  }
  .race-verdict.win { background: var(--peak); color: var(--c-0); }
  .race-verdict.loss { background: var(--accent); color: #fff; }
  .race-reward {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
  }
  .race-reward.win { color: var(--gold); }
  .race-reward.loss { color: var(--text-dim); }

  .race-btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    padding: 9px 14px 11px;
    background: var(--gold);
    color: var(--c-0);
    border: 1px solid var(--c-11);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.2em;
    transition: background 0.12s var(--ease-snap),
                transform 0.08s var(--ease-snap),
                box-shadow 0.08s var(--ease-snap);
    box-shadow: var(--raise-sm), var(--drop);
    white-space: nowrap;
  }
  .race-btn:hover:not(:disabled) { background: var(--c-11); }
  .race-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.3);
  }
  .race-btn:disabled {
    background: var(--c-2);
    border-color: var(--c-2);
    color: var(--text-dim);
    cursor: not-allowed;
    box-shadow: var(--raise-sm);
  }

  /* 黑市 */
  .market-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .market-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--c-3);
    border-radius: 4px;
    box-shadow: var(--raise-sm), var(--drop);
  }
  .market-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
    min-width: 80px;
  }
  .price {
    font-family: var(--font-mono);
    font-size: 22px;
    color: var(--gold);
    font-weight: 700;
    line-height: 1;
  }
  .buy-btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    padding: 9px 14px 11px;
    background: var(--c-9);
    color: #fff;
    border: 1px solid var(--c-9);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.2em;
    transition: background 0.12s var(--ease-snap),
                transform 0.08s var(--ease-snap),
                box-shadow 0.08s var(--ease-snap);
    box-shadow: var(--raise-sm), var(--drop);
    white-space: nowrap;
  }
  .buy-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .buy-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.3);
  }
  .buy-btn:disabled {
    background: var(--c-2);
    border-color: var(--c-2);
    color: var(--text-dim);
    cursor: not-allowed;
    box-shadow: var(--raise-sm);
  }

  /* 交配所 */
  .breeding-panel {
    padding: 16px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: var(--raise-sm), var(--drop);
    margin-bottom: 24px;
  }
  .breed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 12px;
  }
  .breed-col-title {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 700;
    text-align: center;
  }
  .breed-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .breed-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(0,0,0,.2);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s;
    user-select: none;
  }
  .breed-card:hover:not(.disabled):not(.selected) {
    border-color: var(--text-dim);
    background: rgba(0,0,0,.35);
  }
  .breed-card.selected {
    border-color: var(--accent);
    background: rgba(173,47,69,.18);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .breed-card.disabled { opacity: 0.4; cursor: not-allowed; }
  .breed-card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .breed-card-name {
    font-size: 13px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
  }
  .breed-card-stats {
    font-size: 10px; color: var(--text-dim); font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }
  .breed-card-ovr {
    font-family: var(--font-mono); font-size: 16px; color: var(--gold);
    font-weight: 700; line-height: 1; white-space: nowrap;
  }
  .breed-card-age { font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; }
  .breed-empty {
    padding: 24px 12px; text-align: center; color: var(--text-dim);
    font-size: 12px; font-style: italic;
    border: 1px dashed var(--border); border-radius: 4px;
  }
  .breed-pair-display {
    text-align: center; font-size: 12px; color: var(--text-dim);
    margin: 8px 0; letter-spacing: 0.04em; min-height: 18px;
  }
  .breed-pair-display .pair-name { color: var(--text); font-weight: 700; }
  .breed-pair-display .pair-x { margin: 0 8px; color: var(--accent); font-family: var(--font-mono); }
  .breed-actions {
    display: flex; gap: 10px; justify-content: center; margin-top: 10px;
    flex-wrap: wrap;
  }
  .breed-btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    padding: 11px 18px 13px;
    background: var(--c-7);
    color: var(--c-0);
    border: 1px solid var(--c-7);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.2em;
    transition: background 0.12s var(--ease-snap),
                transform 0.08s var(--ease-snap),
                box-shadow 0.08s var(--ease-snap);
    box-shadow: var(--raise-sm), var(--drop);
    white-space: nowrap;
  }
  .breed-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .breed-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.3);
  }
  .breed-btn:disabled {
    background: var(--c-2);
    border-color: var(--c-2);
    color: var(--text-dim);
    cursor: not-allowed;
    box-shadow: var(--raise-sm);
  }

  /* OVR / 突變視覺 / 馬廄折疊 */
  .ovr {
    font-family: var(--font-mono);
    font-size: 22px;
    color: var(--gold);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.04em;
  }
  .stat-pill.mut strong { color: var(--accent-hover); }
  .stat-pill.mut { color: var(--accent-hover); }
  .stable-toggle {
    grid-column: 1 / -1;
    margin-top: 4px;
    padding: 10px 16px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    cursor: pointer;
    text-align: center;
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.2em;
    font-weight: 600;
    transition: border-color 0.12s var(--ease-snap),
                color 0.12s var(--ease-snap),
                background 0.12s var(--ease-snap);
  }
  .stable-toggle:hover {
    border-color: var(--text-dim);
    color: var(--text);
    background: rgba(0,0,0,.15);
  }

  /* 馬廄標題列（含全員出戰按鈕） */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-header .section-title { margin-bottom: 0; }
  .all-race-btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px 10px;
    background: var(--gold);
    color: var(--c-0);
    border: 1px solid var(--c-11);
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.15em;
    transition: background 0.12s var(--ease-snap),
                transform 0.08s var(--ease-snap),
                box-shadow 0.08s var(--ease-snap);
    box-shadow: var(--raise-sm), var(--drop);
    white-space: nowrap;
  }
  .all-race-btn:hover:not(:disabled) { background: var(--c-11); }
  .all-race-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.3);
  }
  .all-race-btn:disabled {
    background: var(--c-2);
    border-color: var(--c-2);
    color: var(--text-dim);
    cursor: not-allowed;
    box-shadow: var(--raise-sm);
  }

  /* 千年大典橫幅 */
  .major-event-banner {
    padding: 10px 18px;
    background: rgba(249,194,43,.1);
    border: 1px solid var(--gold);
    border-radius: 4px;
    color: var(--gold);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-align: center;
    margin-bottom: 14px;
  }
  .race-entry.major { border-left-color: var(--c-5); }

  /* 技能徽章 */
  .skill-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 2px;
    background: rgba(139,155,180,.2);
    color: var(--c-5);
    border: 1px solid var(--c-5);
    letter-spacing: 0.1em;
    font-weight: 700;
    white-space: nowrap;
  }

  /* 特性徽章 */
  .trait-badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 0.1em;
    font-weight: 700;
    cursor: default;
    white-space: nowrap;
    box-shadow: var(--raise-sm);
  }
  .trait-badge.blue { background: rgba(139,155,180,.2); border: 1px solid var(--c-5); color: var(--c-6); }
  .trait-badge.red  { background: rgba(173,47,69,.2);   border: 1px solid var(--accent); color: var(--c-7); }
  .trait-badge.gold { background: rgba(249,194,43,.15); border: 1px solid var(--gold);   color: var(--gold);
                      box-shadow: var(--raise-sm), 0 0 6px rgba(249,194,43,.3); }
  .trait-badge[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.05em;
    white-space: nowrap;
    color: var(--text);
    pointer-events: none;
    z-index: 50;
    box-shadow: var(--drop-lg);
  }
  .trait-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; }
  .trait-warning { font-size: 10px; color: var(--text-dim); letter-spacing: 0.05em; font-style: italic; }

  /* 獸醫建言 */
  .vet-advice {
    width: 100%;
    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 4px;
    padding: 10px 14px;
    margin-top: 2px;
  }
  .vet-name { font-size: 10px; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 5px; }
  .vet-text { font-size: 12px; line-height: 1.7; color: var(--text-dim); font-style: italic; }
  .vet-advice.sev-high   { border-color: rgba(173,47,69,.4); }
  .vet-advice.sev-high   .vet-text { color: var(--c-7); }
  .vet-advice.sev-medium { border-color: rgba(234,79,54,.3); }
  .vet-advice.sev-medium .vet-text { color: var(--c-7); opacity: 0.85; }
  .vet-advice.sev-gold   { border-color: rgba(249,194,43,.4); }
  .vet-advice.sev-gold   .vet-text { color: var(--gold); }

  /* 馬匹清單 Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 300;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%;
    max-width: 680px;
    box-shadow: 0 12px 48px rgba(0,0,0,.7);
    overflow: hidden;
    margin: auto;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 12px; font-weight: 700; letter-spacing: 0.3em; color: var(--text-dim); }
  .modal-close {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 18px; cursor: pointer; padding: 2px 8px; border-radius: 2px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .modal-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .modal-tab {
    padding: 10px 18px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.15em;
    color: var(--text-dim); background: transparent;
    border: none; border-bottom: 2px solid transparent;
    cursor: pointer; transition: color 0.12s;
  }
  .modal-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .modal-tab:hover:not(.active) { color: var(--text); }
  .modal-body { padding: 16px 20px; max-height: 60vh; overflow-y: auto; }
  .modal-horse-list { display: flex; flex-direction: column; gap: 8px; }
  .modal-horse-row {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px;
    background: rgba(0,0,0,.2);
    border: 1px solid var(--border); border-radius: 4px;
  }
  .modal-horse-info { flex: 1; min-width: 0; }
  .modal-horse-name { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .modal-horse-sub  { font-size: 11px; color: var(--text-dim); margin-top: 3px; letter-spacing: 0.04em; }
  .modal-horse-ovr  { font-family: var(--font-mono); font-size: 20px; color: var(--gold); line-height: 1; white-space: nowrap; }
  .modal-empty { padding: 28px; text-align: center; color: var(--text-dim); font-size: 13px; }

  /* Stage D — 活動 / 印記 三選一 */
  .choice-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .choice-card {
    background: rgba(0,0,0,.3); border: 1px solid var(--border); border-radius: 4px;
    padding: 16px 12px; cursor: pointer; transition: all 0.15s;
    display: flex; flex-direction: column; gap: 8px; min-height: 140px;
  }
  .choice-card:hover { border-color: var(--accent); background: rgba(255,255,255,.04); transform: translateY(-2px); }
  .choice-card-title { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); }
  .choice-card-kind {
    font-size: 10px; letter-spacing: 0.2em; color: var(--text-dim);
    border: 1px solid var(--border); padding: 2px 6px; border-radius: 2px;
    align-self: flex-start; text-transform: uppercase;
  }
  .choice-card-desc { font-size: 12px; color: var(--text); line-height: 1.5; }
  .choice-card-target { font-size: 11px; color: var(--text-dim); margin-top: auto; font-style: italic; }
  @media (max-width: 600px) {
    .choice-cards { grid-template-columns: 1fr; }
  }

  /* Stage D — 印記 badge */
  .mark-badge {
    font-size: 10px; padding: 2px 6px; border-radius: 2px;
    background: linear-gradient(135deg, #b8932f, #f0c75e);
    color: #0d0e12; font-weight: 700; letter-spacing: 0.1em;
    border: 1px solid #d4a843;
    text-shadow: 0 0 2px rgba(0,0,0,.3);
  }
  .stable-cap { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; }
  .stable-cap.full { color: #d96666; }

  /* 馬匹清單按鈕 */
  .roster-btn {
    padding: 7px 14px 9px;
    background: rgba(139,155,180,.12);
    color: var(--c-5);
    border: 1px solid var(--c-5);
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 12px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.15em;
    transition: background 0.12s; white-space: nowrap;
  }
  .roster-btn:hover { background: rgba(139,155,180,.28); }

  /* 靈魂區 */
  .soul-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .soul-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: rgba(46,34,47,.5);
    border: 1px solid var(--c-2);
    border-left: 3px solid var(--c-5);
    border-radius: 4px;
    opacity: 0.75;
  }
  .soul-ovr {
    font-family: var(--font-mono);
    font-size: 18px;
    color: var(--c-5);
    line-height: 1;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .soul-name { font-size: 15px; font-weight: 700; color: var(--text-dim); }
  .soul-champion { border-left-color: var(--gold); opacity: 1; background: rgba(249,194,43,.08); }
  .soul-champion .soul-name { color: var(--gold); }
  .soul-champion .soul-ovr  { color: var(--gold); }

  /* Ragnarök 終局 */
  .ragnarok-banner {
    margin-top: 20px;
    padding: 22px;
    background: rgba(173,47,69,.15);
    border: 1px solid var(--accent);
    border-radius: 4px;
    text-align: center;
  }
  .ragnarok-title {
    font-family: var(--font-mono);
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 0.3em;
    text-shadow: 2px 2px 0 rgba(0,0,0,.6);
    margin-bottom: 10px;
  }
  .ragnarok-champion {
    font-family: var(--font-mono);
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .ragnarok-sub { font-size: 12px; color: var(--text-dim); letter-spacing: 0.15em; }
  .ragnarok-battles {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 14px auto 8px;
    max-width: 520px;
  }
  @keyframes rag-appear {
    from { opacity: 0; transform: translateX(-18px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .rag-rank-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 14px;
    border-radius: 2px;
    background: rgba(0,0,0,.2);
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: 0.04em;
    animation: rag-appear 0.3s ease both;
  }
  .rag-rank-row.player { background: rgba(173,47,69,.25); border-left: 2px solid var(--gold); }
  .rag-rank-row .rag-rank-num { color: var(--text-dim); min-width: 48px; text-align: left; }
  .rag-rank-row.player .rag-rank-num { color: var(--gold); font-weight: 700; }
  .rag-rank-row .rag-rank-name { flex: 1; text-align: left; padding-left: 8px; }
  .rag-rank-row.player .rag-rank-name { color: var(--gold); }
  .rag-rank-row .rag-rank-ovr { color: var(--text-dim); font-size: 13px; min-width: 60px; }
  .rag-rank-row .rag-rank-score { color: var(--text-dim); font-size: 13px; min-width: 52px; text-align: right; }
  .log-entry.soul { color: var(--c-5); }

  /* 場地 / 屬性 badge */
  .attr-badge, .terrain-badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 2px;
    font-weight: 700;
    letter-spacing: 0.08em;
    vertical-align: middle;
    white-space: nowrap;
  }
  .attr-badge.attr-Normal { background: rgba(98,85,101,.55); color: var(--c-6); }
  .attr-badge.attr-Fire   { background: rgba(234,79,54,.22); color: var(--c-9); }
  .attr-badge.attr-Ice    { background: rgba(139,155,180,.22); color: var(--c-5); }
  .attr-badge.attr-Sand   { background: rgba(171,148,122,.22); color: var(--c-4); }
  .attr-badge.attr-All    { background: rgba(249,194,43,.22); color: var(--gold); }
  .terrain-badge { background: rgba(0,0,0,.28); color: var(--text-dim); margin-left: 3px; }

  /* 靈魂側欄 */
  .soul-panel {
    position: fixed;
    left: 0;
    top: 0;
    height: 100vh;
    width: 260px;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    z-index: 200;
    transform: translateX(calc(-100% + 32px));
    transition: transform 0.25s var(--ease-snap);
    box-shadow: 4px 0 16px rgba(0,0,0,.5);
    display: flex;
    flex-direction: row;
  }
  .soul-panel.open { transform: translateX(0); }
  .soul-panel-tab {
    width: 32px;
    min-width: 32px;
    background: rgba(139,155,180,.15);
    color: var(--c-5);
    border: none;
    border-left: 3px solid var(--c-5);
    writing-mode: vertical-lr;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.25em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s;
    order: 2;
    padding: 20px 0;
  }
  .soul-panel-tab:hover { background: rgba(139,155,180,.3); }
  .soul-panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 20px;
    order: 1;
  }
  .soul-panel-header {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.4em;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .stat-pill.boosted { color: var(--gold); }
  .stat-pill.boosted strong { color: var(--gold); }

  /* 浮動按鈕（共用基底） */
  .fab-next, .fab-omni {
    position: fixed;
    z-index: 150;
    min-width: 124px;
    text-align: center;
    padding: 14px 22px 16px;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--c-9);
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.2em;
    box-shadow: var(--raise), 0 4px 16px rgba(0,0,0,.55);
    transition: background 0.12s var(--ease-snap),
                transform 0.08s var(--ease-snap);
  }
  .fab-next { bottom: 24px; right: 24px; opacity: 1; pointer-events: auto; transition: background 0.12s var(--ease-snap), transform 0.08s var(--ease-snap), opacity 0.2s ease; }
  .fab-next.hidden { opacity: 0; pointer-events: none; }
  .fab-omni { bottom: 80px; right: 24px; background: var(--c-2); border-color: var(--c-2); color: var(--text-dim); }
  .fab-omni.state-race  { background: var(--gold); border-color: var(--c-11); color: var(--c-0); }
  .fab-omni.state-buy   { background: var(--c-9); border-color: var(--c-9); color: #fff; }
  .fab-omni.state-breed { background: var(--c-7); border-color: var(--c-7); color: var(--c-0); }
  .fab-omni.state-idle  { background: var(--c-2); border-color: var(--c-2); color: var(--text-dim); }
  .fab-next:hover:not(:disabled) { background: var(--accent-hover); }
  .fab-omni:hover:not(:disabled) { filter: brightness(1.08); }
  .fab-next:active:not(:disabled),
  .fab-omni:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: var(--raise-sm), 0 2px 8px rgba(0,0,0,.4);
  }
  .fab-next:disabled,
  .fab-omni:disabled {
    background: var(--c-2);
    border-color: var(--c-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  /* 靈魂區 mobile 觸發按鈕（桌機隱藏） */
  .soul-fab {
    display: none;
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 201;
    width: 30px;
    height: 30px;
    background: rgba(139,155,180,.2);
    border: 1px solid var(--c-5);
    border-radius: 4px;
    color: var(--c-5);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    letter-spacing: 0;
  }
  .soul-fab:hover { background: rgba(139,155,180,.35); }
  /* 半透明遮罩（mobile panel 打開時） */
  .soul-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 199;
  }
  .soul-backdrop.active { display: block; }

  /* 行動版 (≤600px)：放大字級避免手機讀不到 */
  @media (max-width: 600px) {
    body {
      padding: 18px 14px calc(112px + env(safe-area-inset-bottom, 0px));
      font-size: 16px;
    }
    h1 { font-size: 22px; letter-spacing: 0.12em; }
    .subtitle { font-size: 11px; }

    .top-bar { gap: 14px; padding: 14px 16px; }
    .stat-value { font-size: 28px; }
    .stat-sub { font-size: 14px; }
    button.primary { padding: 12px 18px 14px; font-size: 13px; letter-spacing: 0.15em; }

    .section-title { font-size: 12px; letter-spacing: 0.3em; }

    .horse-card, .market-card { padding: 12px 14px; gap: 12px; flex-wrap: wrap; }
    .horse-info, .market-info { min-width: 140px; }
    .horse-name { font-size: 17px; }
    .stats-row { gap: 14px; font-size: 13px; }
    .stat-pill { font-size: 13px; letter-spacing: 0.08em; }
    .stat-pill strong { font-size: 18px; }
    .ovr { font-size: 20px; }
    .age { font-size: 24px; }
    .price { font-size: 20px; }

    .race-btn, .buy-btn { font-size: 12px; padding: 10px 12px 12px; letter-spacing: 0.15em; }

    .breeding-panel { padding: 14px; }
    .breed-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .breed-list { max-height: 240px; }
    .breed-card { padding: 7px 10px; gap: 8px; }
    .breed-card-name { font-size: 12px; }
    .breed-card-stats { font-size: 10px; }
    .breed-card-ovr { font-size: 14px; }
    .breed-btn { font-size: 13px; padding: 12px 16px 14px; }
    .info-toggle { padding: 11px 12px; gap: 10px; }
    .info-toggle-icon { width: 28px; height: 28px; min-width: 28px; padding: 5px; gap: 3px; }
    .info-toggle-title { font-size: 11px; letter-spacing: 0.2em; }
    .info-toggle-sub { font-size: 11px; }
    .info-toggle-state { font-size: 10px; letter-spacing: 0.15em; }
    .info-drawer { padding: 14px; }

    .race-entry { padding: 10px 14px; gap: 10px; font-size: 14px; }
    .race-matchup { font-size: 15px; }
    .race-reward { font-size: 16px; }

    .log { font-size: 14px; padding: 12px 14px; }
    .horse-list { grid-template-columns: 1fr; }
    .all-race-btn { font-size: 12px; padding: 8px 12px 10px; }
    .major-event-banner { font-size: 12px; letter-spacing: 0.15em; padding: 8px 14px; }
    .soul-card { padding: 8px 12px; }
    .soul-name { font-size: 14px; }
    .soul-ovr { font-size: 16px; }
    .ragnarok-title { font-size: 22px; }
    .ragnarok-champion { font-size: 17px; }

    /* Mobile soul panel: fully hidden, controlled by soul-fab */
    .soul-panel {
      width: min(260px, 85vw);
      transform: translateX(-100%);
    }
    .soul-panel.open { transform: translateX(0); }
    .soul-panel-tab { display: none; }
    .soul-fab { display: flex; }

    .fab-actions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 150;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(46,34,47,.94);
      border-top: 1px solid var(--border);
      box-shadow: 0 -6px 20px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
    }
    .fab-next,
    .fab-omni {
      position: static;
      min-width: 0;
      width: 100%;
      padding: 13px 14px 15px;
      box-shadow: var(--raise), var(--drop-lg);
    }
    .fab-next.hidden {
      opacity: 1;
      pointer-events: auto;
    }

    /* Compact horse card stats on narrow screens */
    .horse-actions { flex-wrap: wrap; gap: 6px; }
    .section-header { flex-wrap: wrap; gap: 8px; }
  }
</style>
</head>
<body>
<div id="soul-backdrop" class="soul-backdrop"></div>
<div id="soul-panel" class="soul-panel">
  <div class="soul-panel-content">
    <div class="soul-panel-header">靈魂區</div>
    <div id="soul-list" class="soul-list"></div>
  </div>
  <button class="soul-panel-tab" id="soul-panel-tab">靈魂區</button>
</div>
<button class="soul-fab" id="soul-fab">魂</button>
<div class="container">
  <header>
    <h1>地獄賽馬</h1>
    <span class="subtitle">HELLBRED RACING · 為惡魔之王培育頂尖坐騎</span>
    <button class="roster-btn" id="roster-btn">🐴 馬匹清單</button>
  </header>

  <div class="top-bar">
    <div class="stat">
      <span class="stat-label">紀年</span>
      <span class="stat-value" id="year">0 / 30,000</span>
      <span class="stat-sub" id="year-sub">剩 30 千年</span>
    </div>
    <div class="stat">
      <span class="stat-label">資金</span>
      <span class="stat-value gold" id="money">1,000 G</span>
    </div>
    <button class="primary" id="next-turn">下一個千年</button>
  </div>

  <div id="major-event-banner" class="major-event-banner" style="display:none">⚡ 千年大典 · 賽事獎金加倍、勝者獲賜技能</div>

<script>

  const ENEMY_NAMES = [
    '鬼面', '渡鴉', '夜叉', '魔僕', '無常',
    '獄卒', '咆哮', '炎魔', '邪光', '骨刃',
    '腐骸', '黑焰', '殞靈', '夜梟', '幽煞'
  ];

  const STATE_FOAL = 'foal';
  const STATE_PEAK = 'peak';
  const STATE_RETIRED = 'retired';
  const STATE_LABEL = { foal: '幼駒', peak: '巔峰', retired: '退役' };

  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const randInt = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function statusFromAge(age) {
    if (age <= 0) return STATE_FOAL;
    if (age <= 3) return STATE_PEAK;
    return STATE_RETIRED;
  }

  function newHorseName(origin) {
    const o = origin || randomOrigin();
    return { ...generateHorseName(o), origin: o };
  }

  const BLUE_IDS = ['B01','B02','B03','B04','B05','B06','B07','B08'];
  const RED_IDS  = ['R01','R02','R03','R04','R05','R06'];

  function makeHorse({ age = 0 } = {}) {
    const a = Math.max(0, Math.floor(age));
    const recessiveFlags = Math.random() < 0.6 ? [pick(BLUE_IDS)] : [];
    const displayed = Math.random() < 0.08 ? [{ id: pick(RED_IDS), type:'red' }] : [];
    const origin = randomOrigin();
    const { surname, givenName, name } = generateHorseName(origin);
    return {
      id: (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()),
      origin, surname, givenName, name,
      gender: Math.random() < 0.5 ? 'male' : 'female',
      age: a,
      speed: clamp(randInt(30, 70), 1, 100),
      power: clamp(randInt(30, 70), 1, 100),
      stamina: clamp(randInt(30, 70), 1, 100),
      status: statusFromAge(a),
      racedThisTurn: false,
      bredThisTurn: false,
      skill: null,
      traits: { displayed, recessiveFlags },
      marks: [],
      marksRecessive: [],
      parents: null,
    };
  }

  function effectiveStat(h, stat) {
    return h[stat] + (h.skill && h.skill.stat === stat ? h.skill.bonus : 0);
  }
  function totalStats(h) {
    return effectiveStat(h, 'speed') + effectiveStat(h, 'power') + effectiveStat(h, 'stamina');
  }

  function makeEnemy() {
    const turn = game.yearsElapsed / game.yearPerTurn;
    const base = Math.floor(turn * 1.5);
    const stat = () => clamp(randInt(20 + base, 40 + base), 1, 100);
    return {
      name: pick(ENEMY_NAMES),
      speed: stat(),
      power: stat(),
      stamina: stat()
    };
  }

  function makeMarketHorse() {
    const turn = game.yearsElapsed / game.yearPerTurn;
    const lo = Math.min(35 + Math.floor(turn), 60);
    const hi = Math.min(70 + Math.floor(turn), 95);
    const stat = () => clamp(randInt(lo, hi), 1, 100);
    const speed = stat(), power = stat(), stamina = stat();
    const total = speed + power + stamina;
    const mAge = randInt(1, 4);
    const mOrigin = randomOrigin();
    const { surname: mSurname, givenName: mGiven, name: mName } = generateHorseName(mOrigin);
    return {
      id: (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()),
      origin: mOrigin, surname: mSurname, givenName: mGiven, name: mName,
      gender: Math.random() < 0.5 ? 'male' : 'female',
      age: mAge,
      speed, power, stamina,
      status: statusFromAge(mAge),
      racedThisTurn: false,
      bredThisTurn: false,
      price: Math.max(1, Math.round(total / 25) + randInt(0, 2)),
      skill: null,
      traits: {
        displayed: Math.random() < 0.12 ? [{ id: pick(RED_IDS), type:'red' }] : [],
        recessiveFlags: [pick(BLUE_IDS)],
      },
      marks: [],
      marksRecessive: [],
    };
  }

  const STAT_LABEL = { speed: '速度', power: '力量', stamina: '體力' };
  const ATTR_LABEL = { Normal: '一般', Fire: '烈焰', Ice: '冰川', Sand: '沙漠', All: '全場地' };

    { name: '冥府王',   speed: 65, power: 88, stamina: 70 }, // OVR 74
    { name: '血戰王',   speed: 70, power: 75, stamina: 90 }, // OVR 78

  ];
  const SKILL_LIST = [
    { name: '疾風', stat: 'speed',   bonus: 15 },
    { name: '霸力', stat: 'power',   bonus: 15 },
    { name: '鋼魂', stat: 'stamina', bonus: 15 },
  ];

  const TRAIT_DATA = {
    B01: { id:'B01', type:'blue', name:'蹄炎',     desc:'火焰賽道戰力 +8%' },
    B02: { id:'B02', type:'blue', name:'冰晶體質', desc:'冰雪賽道戰力 +8%' },
    B03: { id:'B03', type:'blue', name:'沙漠之子', desc:'沙漠賽道戰力 +8%' },
    B04: { id:'B04', type:'blue', name:'鐵蹄',     desc:'爬山地形戰力 +10%' },
    B05: { id:'B05', type:'blue', name:'疾風步',   desc:'長平原地形戰力 +10%' },
    B06: { id:'B06', type:'blue', name:'起伏直覺', desc:'起伏地形戰力 +10%' },
    B07: { id:'B07', type:'blue', name:'共鳴體質', desc:'每持有 1 個其他藍特，戰力額外 +3%' },
    B08: { id:'B08', type:'blue', name:'多產血脈', desc:'交配時藍特繼承率提升（單親 50→80%、雙親 70→85%）' },
    R01: { id:'R01', type:'red',  name:'燃盡',     desc:'每場出賽後速度永久 -1' },
    R02: { id:'R02', type:'red',  name:'玻璃骨',   desc:'非對應賽道戰力 -20%' },
    R03: { id:'R03', type:'red',  name:'玻璃心',   desc:'千年大典必敗，無視戰力' },

    R06: { id:'R06', type:'red',  name:'暴食',     desc:'每年消耗 80G 飼料費' },
    G01: { id:'G01', type:'gold', name:'地獄之王', desc:'Ragnarök 中所有屬性視為匹配' },
    G02: { id:'G02', type:'gold', name:'鳳凰之血', desc:'死亡時 30% 機率以幼駒姿態重生（一次性）' },
  };

  const MARK_DATA = {
    M01: { id:'M01', name:'無瑕之眼', desc:'速度上限突破至 115（即刻 +15、上限 100→115）' },
    M02: { id:'M02', name:'戰神血脈', desc:'大典中三圍視為 +10（速/力/體 各 +10）' },
  };
  const MARK_IDS = ['M01', 'M02'];

  const EVENT_CARDS = [
    { id:'E_B01', kind:'trait', traitId:'B01', title:'蹄炎傳承', desc:'將藍特「蹄炎」(火焰賽道+8%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B02', kind:'trait', traitId:'B02', title:'冰晶傳承', desc:'將藍特「冰晶體質」(冰雪賽道+8%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B03', kind:'trait', traitId:'B03', title:'沙漠傳承', desc:'將藍特「沙漠之子」(沙漠賽道+8%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B04', kind:'trait', traitId:'B04', title:'鐵蹄傳承', desc:'將藍特「鐵蹄」(爬山地形+10%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B05', kind:'trait', traitId:'B05', title:'疾風傳承', desc:'將藍特「疾風步」(長平原+10%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B06', kind:'trait', traitId:'B06', title:'起伏傳承', desc:'將藍特「起伏直覺」(起伏地形+10%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_RARE', kind:'marketBuff', title:'稀有馬場', desc:'下個千年的黑市馬匹三圍全部 +15。' },
    { id:'E_GOLD', kind:'gold', amount:5, title:'黃金祭壇', desc:'立即獲得 5G。' },
  ];

  function makeEventChoice() {
    // 從 EVENT_CARDS pool 抽 3 張不重覆
    const pool = [...EVENT_CARDS];
    const cards = [];
    for (let i = 0; i < 3 && pool.length; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      cards.push(pool.splice(idx, 1)[0]);
    }
    return { kind: 'event', cards };
  }

  function applyChoiceCard(card) {
    if (card.kind === 'trait') {
      // 套用至 OVR 最高且尚未持有此特性的現役馬
      const candidates = game.horses
        .filter(h => h.traits && !h.traits.displayed.some(t => t.id === card.traitId))
        .sort((a, b) => ovrOf(b) - ovrOf(a));
      if (!candidates.length) {
        addLog(`活動「${card.title}」無對象可施加（馬廄空或全員已有此特性）`, 'death');
        return;
      }
      const target = candidates[0];
      target.traits.displayed.push({ id: card.traitId, type: 'blue' });
      addLog(`活動「${card.title}」→ ${target.name} 獲得藍特：${TRAIT_DATA[card.traitId].name}`, 'soul');
    } else if (card.kind === 'marketBuff') {
      game.nextMarketBuff = true;
      addLog(`活動「${card.title}」→ 下個千年黑市馬匹 +15 三圍`, 'soul');
    } else if (card.kind === 'gold') {
      game.money += card.amount;
      addLog(`活動「${card.title}」→ 獲得 ${card.amount}G`, 'soul');
    }
  }

  function makeMarkChoice(winnerHorse) {
    // 從 MARK_IDS 排除馬已持有的，最多 3 張（目前池子只有 2 張，所以是 0/1/2）
    const owned = new Set((winnerHorse.marks || []).map(m => m.id));
    const available = MARK_IDS.filter(id => !owned.has(id));
    if (!available.length) return null;
    const cards = available.map(id => ({
      id: 'MARK_' + id,
      kind: 'mark',
      markId: id,
      horseId: winnerHorse.id,
      title: MARK_DATA[id].name,
      desc: MARK_DATA[id].desc,
    }));
    return { kind: 'mark', cards, context: { horseId: winnerHorse.id } };
  }

  function awardMark(horse, markId) {
    if (!horse.marks) horse.marks = [];
    if (!horse.marksRecessive) horse.marksRecessive = [];
    if (horse.marks.length >= 1) return; // 每馬最多 1 印記
    horse.marks.push({ id: markId });
    // 即時效果
    if (markId === 'M01') {
      // 無瑕之眼：speed +15，cap 提升至 115
      horse.speed = Math.min(115, horse.speed + 15);
    }
    addLog(`✨ ${horse.name} 獲得印記：${MARK_DATA[markId].name}`, 'soul');
  }

  function speedCapOf(horse) {
    return horse.marks && horse.marks.some(m => m.id === 'M01') ? 115 : 100;
  }

  const RACE_TYPES = [
    { name:'冥原衝刺', attr:'Normal', terrain:'長平原'  },
    { name:'烈焰賽道', attr:'Fire',   terrain:'長平原'  },
    { name:'冰川之路', attr:'Ice',    terrain:'起伏不定'},
    { name:'沙漠突圍', attr:'Sand',   terrain:'長平原'  },
    { name:'魔山登頂', attr:'Normal', terrain:'爬山'    },
    { name:'地獄起伏', attr:'Fire',   terrain:'起伏不定'},
  ];

  const VET_LINES = {
    goldResonance:{ text:'……老夫行醫數千年，僅見過寥寥數次這種血統共鳴。\n不敢妄言，但請務必好好珍惜這一胎。', sev:'gold' },
    redDouble:    { text:'老夫有句話不得不說……這對血統曾令老夫見過慘烈的結局。\n子代或將承受難以擺脫的詛咒，還請三思。', sev:'high' },
    redSingle:    { text:'此方血液中有些令老夫不安的氣息。\n子代或許會繼承某種難以克服的弱點。', sev:'medium' },
    recessiveB01: { text:'血統中似乎潛藏著與烈火親近的因子。\n若子代繼承，在特定賽道或有驚人表現。', sev:'' },
    recessiveB02: { text:'隱約感受到冰雪血脈的共鳴。\n子代或許天生適應嚴寒之地。', sev:'' },
    recessiveB03: { text:'沙塵的氣息在血統中流動。\n子代在荒漠賽道或有超乎預期的發揮。', sev:'' },
    recessiveB04: { text:'骨骼結構頗為紮實，山地血統的印記清晰可見。\n爬坡或是此子天生的舞台。', sev:'' },
    recessiveB05: { text:'四肢比例修長，有平原疾馳者的血統輪廓。\n長直賽道或能見到此子的真正速度。', sev:'' },
    recessiveB06: { text:'重心極低，對起伏地形有天然的適應傾向。\n或許能在最複雜的賽道中找到節奏。', sev:'' },
    recessiveB07: { text:'血脈中似乎潛藏著某種「共鳴」之力。\n若子代繼承且擁有多個天賦，將彼此放大。', sev:'' },
    recessiveB08: { text:'此血脈生機旺盛，傳承之力勝於常理。\n子代或將更完整地承繼父母的隱性天賦。', sev:'' },
    highDiff:     { text:'血統差異顯著，子代走向難以預測。\n然而，老夫見過最驚人的突破，往往來自這樣的配對。', sev:'' },
    lowDiff:      { text:'兩者血統過於相近，子代恐怕難有突破。\n突變，是唯一的希望。', sev:'' },
    normal:       { text:'這對配對血統相性尚可。\n子代應能穩定繼承雙親之長。', sev:'' },
  };

  function getVetAdvice(father, mother) {
    if (!father || !mother) return null;
    const fReds = father.traits.displayed.filter(t => t.type === 'red');
    const mReds = mother.traits.displayed.filter(t => t.type === 'red');
    if (fReds.find(ft => mReds.some(mt => mt.id === ft.id))) return VET_LINES.redDouble;
    if (fReds.length || mReds.length) return VET_LINES.redSingle;
    const fPool = new Set([
      ...father.traits.recessiveFlags,
      ...father.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
    const mPool = new Set([
      ...mother.traits.recessiveFlags,
      ...mother.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
    const shared = [...fPool].find(id => mPool.has(id));
    if (shared && VET_LINES['recessive' + shared]) return VET_LINES['recessive' + shared];
    const avgDiff = (Math.abs(father.speed - mother.speed) +
                    Math.abs(father.power  - mother.power)  +
                    Math.abs(father.stamina- mother.stamina)) / 3;
    if (avgDiff > 30) return VET_LINES.highDiff;
    if (avgDiff < 10) return VET_LINES.lowDiff;
    return VET_LINES.normal;
  }

  function breedTraits(father, mother) {
    const displayed = [];
    const recessiveFlags = [];
    const addD = t => { if (!displayed.some(x => x.id === t.id)) displayed.push(t); };
    const addR = id => { if (!recessiveFlags.includes(id)) recessiveFlags.push(id); };

    const fBlues = new Set([
      ...father.traits.recessiveFlags,
      ...father.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
    const mBlues = new Set([
      ...mother.traits.recessiveFlags,
      ...mother.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
    const b08Boost =
      father.traits.displayed.some(t => t.id === 'B08') ||
      mother.traits.displayed.some(t => t.id === 'B08');
    const bothRate   = b08Boost ? 0.85 : 0.70;
    const singleRate = b08Boost ? 0.80 : 0.50;
    for (const id of new Set([...fBlues, ...mBlues])) {
      if (fBlues.has(id) && mBlues.has(id)) {
        Math.random() < bothRate ? addD({ id, type:'blue' }) : addR(id);
      } else if (Math.random() < singleRate) {
        addR(id);
      }
    }

    const allRedIds = new Set([
      ...father.traits.displayed.filter(t => t.type === 'red').map(t => t.id),
      ...mother.traits.displayed.filter(t => t.type === 'red').map(t => t.id),
    ]);
    for (const id of allRedIds) {
      const fH = father.traits.displayed.some(t => t.id === id);
      const mH = mother.traits.displayed.some(t => t.id === id);
      if (Math.random() < (fH && mH ? 0.85 : 0.55)) addD({ id, type:'red' });
    }

    if (Math.random() < 0.03) {
      const newRed = pick(RED_IDS);
      if (!displayed.some(t => t.id === newRed)) addD({ id: newRed, type:'red' });
    }

    const goldTriggered = Math.random() < 0.02;
    if (goldTriggered) {
      addD({ id: Math.random() < 0.5 ? 'G01' : 'G02', type:'gold' });
    }
    return { displayed, recessiveFlags, goldTriggered };
  }

  function breedMarks(father, mother) {
    // A 型隱性：雙親同印記 70% 顯現；單親持有 50% 隱性傳遞。每馬 max 1 顯性。
    const displayed = [];
    const recessive = [];
    const fMarks = new Set([
      ...((father.marks || []).map(m => m.id)),
      ...((father.marksRecessive || [])),
    ]);
    const mMarks = new Set([
      ...((mother.marks || []).map(m => m.id)),
      ...((mother.marksRecessive || [])),
    ]);
    for (const id of new Set([...fMarks, ...mMarks])) {
      if (fMarks.has(id) && mMarks.has(id)) {
        if (Math.random() < 0.70 && displayed.length < 1) {
          displayed.push({ id });
        } else {
          recessive.push(id);
        }
      } else if (Math.random() < 0.50) {
        recessive.push(id);
      }
    }
    return { displayed, recessive };
  }

  function applyTraitMultiplier(horse, attr, terrain) {
    const d = horse.traits ? horse.traits.displayed : [];
    if (d.some(t => t.id === 'R04')) return 1.0;
    let m = 1.0;
    if (attr === 'Fire' && d.some(t => t.id === 'B01')) m += 0.08;
    if (attr === 'Ice'  && d.some(t => t.id === 'B02')) m += 0.08;
    if (attr === 'Sand' && d.some(t => t.id === 'B03')) m += 0.08;
    if (terrain === '爬山'     && d.some(t => t.id === 'B04')) m += 0.10;
    if (terrain === '長平原'   && d.some(t => t.id === 'B05')) m += 0.10;
    if (terrain === '起伏不定' && d.some(t => t.id === 'B06')) m += 0.10;
    if (d.some(t => t.id === 'B07')) {
      const otherBlue = d.filter(t => t.type === 'blue' && t.id !== 'B07').length;
      m += 0.03 * otherBlue;
    }
    if (d.some(t => t.id === 'R02')) {
      const matches = attr === 'Normal' ||
        (attr === 'Fire' && d.some(t => t.id === 'B01')) ||
        (attr === 'Ice'  && d.some(t => t.id === 'B02')) ||
        (attr === 'Sand' && d.some(t => t.id === 'B03'));
      if (!matches) m -= 0.20;
    }
    return m;
  }

  const ovrOf = h => Math.round(totalStats(h) / 3);

  const game = {
    yearsElapsed: 0,
    maxYears: 30000,
    yearPerTurn: 1000,
    money: 10,
    horses: [],
    souls: [],
    market: [],
    races: [],
    log: [],
    stableExpanded: false,
    infoDrawerOpen: false,
    currentTurnMajor: false,
    currentTurnPhase: 'race', // 'event' | 'race' | 'major'
    ragnarok: null,
    breedFatherId: null,
    breedMotherId: null,
    stableSize: 6,
    nextMarketBuff: false,
    pendingChoice: null, // { kind: 'event'|'mark', cards: [...], context: {...} }
    pendingChoiceQueue: [],
  };

  function pushPending(choice) {
    if (!choice) return;
    if (!game.pendingChoice) game.pendingChoice = choice;
    else game.pendingChoiceQueue.push(choice);
  }
  function resolvePending() {
    game.pendingChoice = game.pendingChoiceQueue.shift() || null;
  }

  function init() {
    game.horses = [
      makeHorse({ age: 0 }),
      makeHorse({ age: 1 }),
      makeHorse({ age: 3 })
    ];
    game.market = Array.from({ length: 4 }, makeMarketHorse);
    addLog(`紀年 0 · 馬廄入駐 ${game.horses.length} 匹馬，等候千年的審判。`);
    render();
  }

  function nextTurn() {
    if (game.yearsElapsed >= game.maxYears) return;
    game.yearsElapsed += game.yearPerTurn;
    window.scrollTo({ top: 0, behavior: 'smooth' });

    const currentTurn = game.yearsElapsed / game.yearPerTurn;
    const phaseInCycle = ((currentTurn - 1) % 6) + 1; // 1..6
    if (phaseInCycle === 6) {
      game.currentTurnPhase = 'major';
      game.currentTurnMajor = true;
    } else if (phaseInCycle === 3) {
      game.currentTurnPhase = 'race';
      game.currentTurnMajor = false;
    } else {
      game.currentTurnPhase = 'event';
      game.currentTurnMajor = false;
    }
    if (currentTurn % 6 === 0) {
      game.stableSize += 1;
      addLog(`🏛 馬廄擴建 → ${game.stableSize} 格`, 'soul');
    }

    for (const h of game.horses) {
      h.age += 1;
      h.status = statusFromAge(h.age);
      h.racedThisTurn = false;
      h.bredThisTurn = false;
    }
    let foodCost = 0;
    const foodEaters = [];
    for (const h of game.horses) {
      if (h.traits && h.traits.displayed.some(t => t.id === 'R06')) {
        foodCost += 1;
        foodEaters.push(h.name);
      }
    }
    if (foodCost > 0) {
      game.money = Math.max(0, game.money - foodCost);
      addLog(`暴食特性 −${foodCost}G 飼料費（${foodEaters.join('、')}）`, 'death');
    }
    const ascending = [];
    const reborn = [];
    for (let i = game.horses.length - 1; i >= 0; i--) {
      const h = game.horses[i];
      const hasR05 = h.traits && h.traits.displayed.some(t => t.id === 'R05');
      if (h.age >= (hasR05 ? 4 : 5)) {
        const hasG02 = h.traits && h.traits.displayed.some(t => t.id === 'G02');
        if (hasG02 && Math.random() < 0.30) {
          h.age = 0;
          h.status = STATE_FOAL;
          h.racedThisTurn = false;
          h.bredThisTurn = false;
          h.traits.displayed = h.traits.displayed.filter(t => t.id !== 'G02');
          reborn.push(h.name);
        } else {
          ascending.push(game.horses.splice(i, 1)[0]);
        }
      }
    }
    if (reborn.length) {
      addLog(`🔥 鳳凰之血燃燒：${reborn.join('、')} 以幼駒姿態重生！`, 'soul');
    }
    if (ascending.length) {
      game.souls.push(...ascending);
      addLog(`升入靈魂區：${ascending.map(h => h.name).join('、')}`, 'soul');
    }

    const buffApplied = game.nextMarketBuff;
    game.market = Array.from({ length: 4 }, makeMarketHorse);
    if (buffApplied) {
      game.market.forEach(m => {
        m.speed = clamp(m.speed + 15, 1, 100);
        m.power = clamp(m.power + 15, 1, 100);
        m.stamina = clamp(m.stamina + 15, 1, 100);
        const total = m.speed + m.power + m.stamina;
        m.price = Math.max(1, Math.round(total / 25) + randInt(0, 2));
        m._rare = true;
      });
      addLog(`✨ 稀有馬場開張 · 黑市馬匹三圍 +15`, 'soul');
      game.nextMarketBuff = false;
    }

    const phaseTag = game.currentTurnPhase === 'major' ? '〔千年大典〕 '
                   : game.currentTurnPhase === 'race'  ? '〔小賽事〕 '
                   : '〔活動〕 ';
    addLog(`${phaseTag}紀年 ${game.yearsElapsed.toLocaleString()} · 千年流逝。`);

    if (game.currentTurnPhase === 'event') {
      pushPending(makeEventChoice());
    }

    if (game.yearsElapsed >= game.maxYears) {
      addLog(`時辰已盡 · 30 個千年皆已過去。`);
    }
    render();
  }

  function getRaceBatch() {
    if (game.currentTurnPhase === 'event') return [];
    const eligible = game.horses.filter(h => h.status === STATE_PEAK && !h.racedThisTurn);
    if (!game.currentTurnMajor) return eligible;
    const racedCount = game.horses.filter(h => h.racedThisTurn).length;
    const slots = Math.max(0, 2 - racedCount);
    return [...eligible].sort((a, b) => ovrOf(b) - ovrOf(a)).slice(0, slots);
  }

  function getAffordableMarketCount() {
    return game.market.filter(m => game.money >= m.price).length;
  }

  function runAllRaces() {
    const batch = getRaceBatch();
    if (!batch.length) return;
    batch.forEach(h => runRace(h.id));
    if (!game.infoDrawerOpen) {
      game.infoDrawerOpen = true;
      render();
      requestAnimationFrame(() =>
        document.getElementById('info-toggle').scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }
  }

  function buyMarketHorse(marketId) {
    if (game.currentTurnPhase === 'event') return;
    const idx = game.market.findIndex(m => m.id === marketId);
    if (idx < 0) return;
    const horse = game.market[idx];
    if (game.money < horse.price) return;
    if (game.horses.length >= game.stableSize) {
      addLog(`馬廄已滿（${game.stableSize}/${game.stableSize}），無法買入 ${horse.name}。`, 'death');
      render();
      return;
    }
    const price = horse.price;
    delete horse.price;
    game.money -= price;
    game.horses.push(horse);
    game.market.splice(idx, 1);
    addLog(`購入：${horse.name}（${horse.gender === 'male' ? '公' : '母'}） −${price.toLocaleString()}G`);
    render();
  }

  let __cardSilent = false;
  function breed(fatherId, motherId) {
    if (game.currentTurnPhase === 'event') return null;
    const father = game.horses.find(h => h.id === fatherId);
    const mother = game.horses.find(h => h.id === motherId);
    if (!father || !mother) return null;
    if (father.age < 1 || father.age > 4 || mother.age < 1 || mother.age > 4) return null;
    if (father.gender !== 'male' || mother.gender !== 'female') return null;
    if (mother.bredThisTurn) return null;
    if (game.horses.length >= game.stableSize) {
      if (!__cardSilent) addLog(`馬廄已滿（${game.stableSize}/${game.stableSize}），${mother.name} 暫緩交配。`, 'death');
      return null;
    }

    const events = [];
    const mutated = { speed: false, power: false, stamina: false };
    const breedStat = (key) => {
      const midpoint = (father[key] + mother[key]) / 2;
      const regressed = midpoint * (1 - REGRESSION_PULL) + POPULATION_MEAN * REGRESSION_PULL;
      const noise = (Math.random() - 0.5) * BREED_NOISE;
      let stat = regressed + noise;
      const roll = Math.random();
      if (roll < MUTATION_RATE) {
        events.push(`${STAT_LABEL[key]}突變+20`);
        mutated[key] = true;
        stat += 20;
      } else if (roll < MUTATION_RATE + DEGENERATION_RATE) {
        events.push(`${STAT_LABEL[key]}劣化-15`);
        stat -= 15;
      }
      return clamp(Math.round(stat), 1, 100);
    };

    const childTraits = breedTraits(father, mother);
    const childMarks = breedMarks(father, mother);
    const cOrigin = childOrigin(father, mother, ovrOf);
    const { surname: cSurname, givenName: cGiven, name: cName } = generateChildName(father, mother, cOrigin, ovrOf);
    const child = {
      id: (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()),
      origin: cOrigin, surname: cSurname, givenName: cGiven, name: cName,
      gender: Math.random() < 0.5 ? 'male' : 'female',
      age: 0,
      speed: breedStat('speed'),
      power: breedStat('power'),
      stamina: breedStat('stamina'),
      status: STATE_FOAL,
      racedThisTurn: false,
      bredThisTurn: false,
      mutated,
      skill: null,
      traits: { displayed: childTraits.displayed, recessiveFlags: childTraits.recessiveFlags },
      marks: childMarks.displayed,
      marksRecessive: childMarks.recessive,
      parents: {
        father: { id: father.id, name: father.name, ovr: ovrOf(father), origin: father.origin },
        mother: { id: mother.id, name: mother.name, ovr: ovrOf(mother), origin: mother.origin },
      },
    };
    const parentSkills = [father.skill, mother.skill].filter(Boolean);
    if (parentSkills.length && Math.random() < 0.5) {
      child.skill = pick(parentSkills);
    }

    // 印記顯性遺傳的即時效果（M01 立即 +15 速度）
    if (child.marks.some(m => m.id === 'M01')) {
      child.speed = Math.min(115, child.speed + 15);
    }

    game.horses.push(child);
    mother.bredThisTurn = true;

    const eventStr = events.length ? `〔${events.join('、')}〕` : '';
    const skillInherit = child.skill ? ` 繼承技能：${child.skill.name}` : '';
    const goldTag = childTraits.goldTriggered ? ' ✨【地獄之王】降臨！' : '';
    const traitNames = childTraits.displayed.filter(t => t.type !== 'gold').map(t => TRAIT_DATA[t.id]?.name).filter(Boolean);
    const traitTag = traitNames.length ? ` 特性：${traitNames.join('、')}` : '';
    const markNames = child.marks.map(m => MARK_DATA[m.id]?.name).filter(Boolean);
    const markTag = markNames.length ? ` ✨印記：${markNames.join('、')}` : '';
    addLog(`交配：${father.name} × ${mother.name} → ${child.name}（${child.gender === 'male' ? '公' : '母'}） ${eventStr}${skillInherit}${traitTag}${goldTag}${markTag}`, (goldTag || markTag) ? 'soul' : '');
    render();
    if (!__cardSilent && typeof window.openHorseCard === 'function') {
      const lucky = typeof window.isLuckyBirth === 'function' && window.isLuckyBirth(child);
      window.openHorseCard(child, { reveal: true, lucky });
    }
    return child;
  }

  function runRace(horseId) {
    if (game.currentTurnPhase === 'event') return;
    const h = game.horses.find(x => x.id === horseId);
    if (!h || h.status !== STATE_PEAK || h.racedThisTurn) return;

    const isMajor = game.currentTurnMajor;
    if (isMajor) {
      const alreadyRaced = game.horses.filter(x => x.racedThisTurn).length;
      if (alreadyRaced >= 2) return;
    }
    const raceType = pick(RACE_TYPES);
    const enemy = makeEnemy();
    const variance = () => 0.8 + Math.random() * 0.4;
    const traitMult = applyTraitMultiplier(h, raceType.attr, raceType.terrain);
    const m02Bonus = (isMajor && h.marks && h.marks.some(m => m.id === 'M02')) ? 30 : 0;
    const playerScore = (totalStats(h) + m02Bonus) * traitMult * variance();
    const enemyScore = totalStats(enemy) * variance();

    const hasR03 = h.traits && h.traits.displayed.some(t => t.id === 'R03');
    const r03Forced = isMajor && hasR03;
    const won = r03Forced ? false : (playerScore >= enemyScore);
    const reward = won ? (isMajor ? 10 : 3) : (isMajor ? 2 : 1);
    game.money += reward;
    h.racedThisTurn = true;

    // R01 燃盡：每場出賽速度永久 -1
    if (h.traits && h.traits.displayed.some(t => t.id === 'R01')) {
      h.speed = Math.max(1, h.speed - 1);
    }

    let newSkill = null;
    if (won && isMajor && !h.skill) {
      const bestStat = ['speed', 'power', 'stamina'].reduce((a, b) => h[a] > h[b] ? a : b);
      newSkill = SKILL_LIST.find(s => s.stat === bestStat) || SKILL_LIST[0];
      h.skill = newSkill;
    }
    if (won && isMajor) {
      const markChoice = makeMarkChoice(h);
      if (markChoice) pushPending(markChoice);
    }

    game.races.unshift({
      year: game.yearsElapsed,
      player: { name: h.name, total: totalStats(h), score: Math.round(playerScore) },
      enemy: { name: enemy.name, total: totalStats(enemy), score: Math.round(enemyScore) },
      won, reward, isMajor,
      skillEarned: newSkill ? newSkill.name : null,
      raceType: raceType.name,
      raceAttr: raceType.attr,
      raceTerrain: raceType.terrain,
      traitMult: traitMult !== 1 ? traitMult : null,
    });
    if (game.races.length > 5) game.races.length = 5;

    const majorTag = isMajor ? '〔千年大典〕 ' : '';
    const skillTag = newSkill ? ` 獲得技能：${newSkill.name}` : '';
    const traitTag = traitMult !== 1 ? ` [特性×${traitMult.toFixed(2)}]` : '';
    const r03Tag = r03Forced ? ' 💔玻璃心崩潰' : '';
    addLog(
      `${majorTag}${raceType.name} · ${h.name} ${won ? '擊敗' : '不敵'} ${enemy.name}（+${reward}G）${skillTag}${traitTag}${r03Tag}`,
      won ? '' : 'death'
    );
    render();
  }

  function addLog(text, kind = '') {
    game.log.unshift({ text, kind });
    if (game.log.length > 30) game.log.length = 30;
  }

  function getBluePool(horse) {
    if (!horse.traits) return new Set();
    return new Set([
      ...horse.traits.recessiveFlags,
      ...horse.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
  }

  function getRedIds(horse) {
    return horse.traits
      ? horse.traits.displayed.filter(t => t.type === 'red').map(t => t.id)
      : [];
  }

  function breedPairScore(father, mother) {
    const fatherBlue = getBluePool(father);
    const motherBlue = getBluePool(mother);
    const sharedBlue = [...fatherBlue].filter(id => motherBlue.has(id)).length;

    const fatherRed = getRedIds(father);
    const motherRed = getRedIds(mother);
    const sharedRed = fatherRed.filter(id => motherRed.includes(id)).length;
    const totalRed = new Set([...fatherRed, ...motherRed]).size;
    const statDiff = (
      Math.abs(father.speed - mother.speed) +
      Math.abs(father.power - mother.power) +
      Math.abs(father.stamina - mother.stamina)
    ) / 18;
    const skillBonus = (father.skill ? 5 : 0) + (mother.skill ? 4 : 0);
    return (
      ovrOf(father) * 1.25 +
      ovrOf(mother) +
      sharedBlue * 12 +
      skillBonus -
      sharedRed * 32 -
      totalRed * 6 -
      statDiff
    );
  }

  function getSmartBreedPairs() {
    const breedAge = h => h.age >= 1 && h.age <= 4;
    const eligibleMales = game.horses.filter(h => breedAge(h) && h.gender === 'male');
    const eligibleFemales = game.horses
      .filter(h => breedAge(h) && h.gender === 'female' && !h.bredThisTurn)
      .sort((a, b) => ovrOf(b) - ovrOf(a));
    if (!eligibleMales.length || !eligibleFemales.length) return [];
    return eligibleFemales.map(mother => {
      const father = eligibleMales.reduce((best, candidate) =>
        breedPairScore(candidate, mother) > breedPairScore(best, mother) ? candidate : best
      );
      return { father, mother, score: breedPairScore(father, mother) };
    });
  }

  function buyAllMarket() {
    game.market.filter(m => m.gender === 'female').forEach(m => buyMarketHorse(m.id));
    const bestMale = [...game.market]
      .filter(m => m.gender === 'male')
      .sort((a, b) => ovrOf(b) - ovrOf(a))
      .find(m => game.money >= m.price);
    if (bestMale) buyMarketHorse(bestMale.id);
  }

  function breedAll() {
    __cardSilent = true;
    const luckyChildren = [];
    getSmartBreedPairs().forEach(({ father, mother }) => {
      const child = breed(father.id, mother.id);
      if (child && window.isLuckyBirth && window.isLuckyBirth(child)) luckyChildren.push(child);
    });
    __cardSilent = false;
    if (luckyChildren.length && window.openHorseCard) {
      // 一鍵交配只挑最高 OVR 的幸運兒呈現，避免卡片連發
      luckyChildren.sort((a, b) => ovrOf(b) - ovrOf(a));
      window.openHorseCard(luckyChildren[0], { reveal: true, lucky: true });
    }
  }

  function smartBuy() {
    const mktF = [...game.market].filter(m => m.gender === 'female').sort((a, b) => ovrOf(b) - ovrOf(a));
    const mktM = [...game.market].filter(m => m.gender === 'male').sort((a, b) => ovrOf(b) - ovrOf(a));
    if (!mktF.length && !mktM.length) return;

    // 足夠做完整一鍵買入？
    const allFCost = mktF.reduce((s, m) => s + m.price, 0);
    const topMale = mktM[0];
    if (game.money >= allFCost + (topMale ? topMale.price : 0)) {
      buyAllMarket();
      return;
    }

    // Greedy：優先母馬，但確保至少有一對公母可交配
    const hasMale = game.horses.some(h => h.gender === 'male' && h.age >= 1 && h.age <= 4);
    if (hasMale) {
      mktF.forEach(f => { if (game.money >= f.price) buyMarketHorse(f.id); });
    } else {
      // 需要留預算買一匹公馬
      const affordable = mktM.filter(m => m.price <= game.money).sort((a, b) => a.price - b.price);
      if (!affordable.length) {
        mktF.forEach(f => { if (game.money >= f.price) buyMarketHorse(f.id); });
        return;
      }
      const reserve = affordable[0].price;
      // 買母馬，留 reserve
      mktF.forEach(f => { if (game.money - f.price >= reserve) buyMarketHorse(f.id); });
      // 買最強公馬
      const bestM = mktM.find(m => game.money >= m.price);
      if (bestM) buyMarketHorse(bestM.id);
      // 剩餘金錢再掃母馬
      mktF.forEach(f => {
        if (game.market.some(m => m.id === f.id) && game.money >= f.price) buyMarketHorse(f.id);
      });
    }
  }

  function getOmniAction() {
    if (game.yearsElapsed >= game.maxYears) {
      return { key: 'idle', label: '終局', disabled: true };
    }
    const raceBatch = getRaceBatch();
    if (raceBatch.length) {
      return {
        key: 'race',
        label: game.currentTurnMajor ? `大典出戰 (${raceBatch.length})` : `全體出戰 (${raceBatch.length})`,
        disabled: false,
      };
    }
    const affordableCount = getAffordableMarketCount();
    if (affordableCount) {
      return { key: 'buy', label: `全體購買 (${affordableCount})`, disabled: false };
    }
    const breedPairs = getSmartBreedPairs();
    if (breedPairs.length) {
      return { key: 'breed', label: `智能交配 (${breedPairs.length})`, disabled: false };
    }
    return { key: 'idle', label: '待下一年', disabled: true };
  }

  function runOmniAction() {
    const action = getOmniAction();
    if (action.disabled) return;
    if (action.key === 'race') {
      runAllRaces();
      return;
    }
    if (action.key === 'buy') {
      smartBuy();
      return;
    }
    if (action.key === 'breed') {
      breedAll();
    }
  }

  const RANK_LABELS = ['冠軍', '亞軍', '季軍'];
  function triggerRagnarok() {
    const playerFighters = [...game.souls, ...game.horses];
    const variance = () => 0.8 + Math.random() * 0.4;
    const entries = [
      ...playerFighters.map(h => {
        const hasG01 = h.traits && h.traits.displayed.some(t => t.id === 'G01');
        let traitMult = 1.0;
        let raceAttr, raceTerrain;
        if (hasG01) {
          raceAttr = 'All'; raceTerrain = '全場地';
          const d = h.traits.displayed;
          if (d.some(t => t.id === 'B01')) traitMult += 0.08;
          if (d.some(t => t.id === 'B02')) traitMult += 0.08;
          if (d.some(t => t.id === 'B03')) traitMult += 0.08;
          if (d.some(t => t.id === 'B04')) traitMult += 0.10;
          if (d.some(t => t.id === 'B05')) traitMult += 0.10;
          if (d.some(t => t.id === 'B06')) traitMult += 0.10;
        } else {
          const rt = pick(RACE_TYPES);
          raceAttr = rt.attr; raceTerrain = rt.terrain;
          traitMult = applyTraitMultiplier(h, rt.attr, rt.terrain);
        }
        return {
          name: h.name, ovr: ovrOf(h),
          skillName: h.skill ? h.skill.name : null,
          hasG01, raceAttr, raceTerrain,
          score: Math.round(totalStats(h) * traitMult * variance()),
          isPlayer: true,
        };
      }),
      ...FOUR_KINGS.map(k => {
        const tot = k.speed + k.power + k.stamina;
        return { name: k.name, ovr: Math.round(tot / 3), skillName: null,
                 score: Math.round(tot * variance()), isPlayer: false };
      }),
    ];
    entries.sort((a, b) => b.score - a.score);
    game.ragnarok = { entries, totalPlayers: playerFighters.length };
    const best = entries.find(e => e.isPlayer);
    const rank = best ? entries.indexOf(best) + 1 : null;
    const rankLabel = rank ? (RANK_LABELS[rank - 1] || `第 ${rank} 名`) : '無人參戰';
    addLog(`⚡ RAGNARÖK · ${best ? best.name : '無馬'} 奪得${rankLabel}！`, 'soul');
    render();
  }

  function render() {
    const remaining = (game.maxYears - game.yearsElapsed) / game.yearPerTurn;
    document.getElementById('year').textContent =
      `${game.yearsElapsed.toLocaleString()} / 30,000`;
    document.getElementById('year-sub').textContent =
      remaining > 0 ? `剩 ${remaining} 千年` : '終局';
    document.getElementById('money').textContent = `${game.money.toLocaleString()} G`;

    const btn = document.getElementById('next-turn');
    const blockedByChoice = !!game.pendingChoice;
    btn.disabled = game.yearsElapsed >= game.maxYears || blockedByChoice;
    btn.textContent = game.yearsElapsed >= game.maxYears ? '時辰已盡'
                    : blockedByChoice ? '請先做出選擇'
                    : '下一個千年';
    const fabBtn = document.getElementById('fab-next');
    fabBtn.disabled = btn.disabled;
    fabBtn.textContent = game.yearsElapsed >= game.maxYears ? '終局'
                       : blockedByChoice ? '選擇'
                       : '下一年';

    const omniAction = getOmniAction();
    const omniBtn = document.getElementById('fab-omni');
    omniBtn.textContent = omniAction.label;
    omniBtn.disabled = omniAction.disabled;
    omniBtn.className = `fab-omni state-${omniAction.key}`;

    const allRaceBtn = document.getElementById('all-race-btn');
    const eligibleCount = game.horses.filter(h => h.status === STATE_PEAK && !h.racedThisTurn).length;
    const racedCount = game.horses.filter(h => h.racedThisTurn).length;
    const majorSlots = game.currentTurnMajor ? Math.max(0, 2 - racedCount) : eligibleCount;
    const effectiveEligible = game.currentTurnMajor ? Math.min(eligibleCount, majorSlots) : eligibleCount;
    allRaceBtn.disabled = effectiveEligible === 0 || game.yearsElapsed >= game.maxYears;
    allRaceBtn.textContent = game.currentTurnMajor
      ? (majorSlots > 0 ? `大典出戰 (${effectiveEligible})` : '名額已滿')
      : (eligibleCount > 0 ? `全員出戰 (${eligibleCount})` : '全員出戰');

    const phaseBanner = document.getElementById('major-event-banner');
    if (game.yearsElapsed > 0 && game.yearsElapsed < game.maxYears + 1) {
      if (game.currentTurnPhase === 'major') {
        phaseBanner.style.display = 'block';
        phaseBanner.textContent = '⚡ 千年大典 · 賽事獎金加倍、勝者獲賜技能與印記';
      } else if (game.currentTurnPhase === 'race') {
        phaseBanner.style.display = 'block';
        phaseBanner.textContent = '🏇 小賽事千年 · 全員出戰賺取黃金';
      } else {
        phaseBanner.style.display = 'block';
        phaseBanner.textContent = '✨ 活動千年 · 三選一獎勵';
      }
    } else {
      phaseBanner.style.display = 'none';
    }

    const smartPairs = getSmartBreedPairs();
    const infoToggle = document.getElementById('info-toggle');
    const infoDrawer = document.getElementById('info-drawer');
    infoToggle.classList.toggle('open', game.infoDrawerOpen);
    infoToggle.setAttribute('aria-expanded', String(game.infoDrawerOpen));
    infoDrawer.classList.toggle('open', game.infoDrawerOpen);
    document.getElementById('info-toggle-state').textContent = game.infoDrawerOpen ? '收起' : '展開';
    document.getElementById('info-toggle-sub').textContent =
      `播報 ${game.races.length} · 黑市 ${game.market.length} · 交配 ${smartPairs.length} · 紀錄 ${game.log.length}`;

    const feed = document.getElementById('race-feed');
    if (!game.races.length) {
      feed.innerHTML = `<div class="race-empty">尚未開戰，遣巔峰馬出戰即可賺取黃金。</div>`;
    } else {
      feed.innerHTML = game.races.map(r => `
        <div class="race-entry ${r.won ? 'win' : 'loss'}${r.isMajor ? ' major' : ''}">
          <span class="race-year">${r.isMajor ? '⚡ ' : ''}紀年 ${r.year.toLocaleString()}${r.raceType ? ' · ' + r.raceType : ''}${r.raceAttr ? ` <span class="attr-badge attr-${r.raceAttr}">${ATTR_LABEL[r.raceAttr]||r.raceAttr}</span>` : ''}${r.raceTerrain ? `<span class="terrain-badge">${r.raceTerrain}</span>` : ''}</span>

            <span class="player">${r.player.name}</span><span class="score">[${r.player.score}]</span>
            <span class="vs">VS</span>
            <span class="enemy">${r.enemy.name}</span><span class="score">[${r.enemy.score}]</span>
          </span>
          <span class="race-verdict ${r.won ? 'win' : 'loss'}">${r.won ? '勝' : '敗'}</span>

        </div>
      `).join('');
    }

    const breedAge = h => h.age >= 1 && h.age <= 4;
    const males   = game.horses.filter(h => breedAge(h) && h.gender === 'male');
    const females = game.horses.filter(h => breedAge(h) && h.gender === 'female');
    if (!males.find(h => h.id === game.breedFatherId)) game.breedFatherId = null;
    const selF = females.find(h => h.id === game.breedMotherId);
    if (!selF || selF.bredThisTurn) game.breedMotherId = null;

    const cardHtml = (h, role) => {
      const sel = (role === 'male' ? game.breedFatherId : game.breedMotherId) === h.id;
      const disabled = role === 'female' && h.bredThisTurn;
      const cls = `breed-card${sel ? ' selected' : ''}${disabled ? ' disabled' : ''}`;
      const ageTag = disabled ? '已配' : `${h.age}歲`;
      return `
        <div class="${cls}" data-bid="${h.id}" data-role="${role}">
          <div class="breed-card-main">
            <div class="breed-card-name">${h.name}${h.skill ? ` <span class="skill-badge">${h.skill.name}</span>` : ''}</div>

    femaleListEl.innerHTML = females.length ? females.map(h => cardHtml(h, 'female')).join('') : `<div class="breed-empty">無 1–4 歲母馬</div>`;

    const breedBtnEl = document.getElementById('breed-btn');
    const father = males.find(h => h.id === game.breedFatherId);

    const pairEl = document.getElementById('breed-pair-display');
    pairEl.innerHTML = (father && mother)
      ? `<span class="pair-name">${father.name}</span><span class="pair-x">×</span><span class="pair-name">${mother.name}</span>`
      : `<span style="opacity:.5">— 各選一隻公母即可看博士建言 —</span>`;
    breedBtnEl.disabled = !(father && mother);
    const fertileFemales = females.filter(h => !h.bredThisTurn);
    document.getElementById('breed-all-btn').disabled = !males.length || !fertileFemales.length;
    document.getElementById('breed-all-btn').textContent = smartPairs.length ? `智能交配 (${smartPairs.length})` : '智能交配';

    const vetBlock = document.getElementById('vet-advice-block');
    if (father && mother) {
      const advice = getVetAdvice(father, mother);
      vetBlock.style.display = '';
      vetBlock.className = `vet-advice${advice.sev ? ' sev-' + advice.sev : ''}`;
      vetBlock.innerHTML = `<div class="vet-name">🩺 瓦 拉 克 博 士 · 建 言</div><div class="vet-text">${advice.text.replace(/\n/g, '<br>')}</div>`;
    } else {
      vetBlock.style.display = 'none';

    const buyAllBtn = document.getElementById('buy-all-market-btn');
    const affordableCount = getAffordableMarketCount();

    const marketList = document.getElementById('market-list');
