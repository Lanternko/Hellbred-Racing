<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>地獄賽馬 · Hellbred Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <header>
    <h1>地獄賽馬</h1>
    <span class="subtitle">HELLBRED RACING · 為惡魔之王培育頂尖坐騎</span>
    <button class="roster-btn" id="roster-btn">🐴 馬匹清單</button>
    <button class="anim-toggle-btn" id="anim-toggle-btn" title="大典動畫開關">▶ 動畫 ON</button>
  </header>

  <div class="top-bar">
    <div class="stat">
      <span class="stat-label">紀元</span>
      <span class="stat-value" id="year">0 / 30</span>
      <span class="stat-sub" id="year-sub">剩 30 年</span>
    </div>
    <div class="stat">
      <span class="stat-label">資金</span>
      <span class="stat-value gold" id="money">1,000 G</span>
    </div>
    <button class="primary" id="next-turn">下一年</button>
  </div>

  <div id="major-event-banner" class="major-event-banner" style="display:none">⚡ 大典 · 賽事獎金加倍、勝者獲賜技能</div>

  <div id="race-venue-card" class="race-venue-card" style="display:none">
    <div class="venue-label">本年賽道</div>
    <div class="venue-main">
      <span class="venue-name" id="venue-name"></span>
      <span class="venue-badges">
        <span class="attr-badge" id="venue-attr"></span>
        <span class="terrain-badge" id="venue-terrain"></span>
      </span>
    </div>
    <div class="venue-hint" id="venue-hint"></div>
  </div>

  <div class="section-header">
    <div class="section-title">先發名單 <span class="stable-cap" id="stable-cap"></span></div>
    <button class="all-race-btn" id="all-race-btn" disabled>全員出戰</button>
  </div>
  <div class="horse-list" id="horse-list"></div>

  <div id="roster-actions" class="roster-actions">
    <button class="phase-advance-btn" id="advance-roster-btn">整 隊 完 成 → 開 戰</button>
  </div>

  <div id="bench-section" class="bench-section">
    <div class="section-header">
      <div class="section-title">替補席 <span class="stable-cap" id="bench-cap"></span></div>
    </div>
    <div class="horse-list" id="bench-list"></div>
  </div>

  <div class="info-toggle-wrap">
    <button class="info-toggle" id="info-toggle" aria-expanded="false" aria-controls="info-drawer">
      <span class="info-toggle-icon" aria-hidden="true"><span></span><span></span></span>
      <span class="info-toggle-copy">
        <span class="info-toggle-title">資訊欄</span>
        <span class="info-toggle-sub" id="info-toggle-sub">播報 0 · 黑市 0 · 交配 0 · 紀錄 0</span>
      </span>
      <span class="info-toggle-state" id="info-toggle-state">展開</span>
    </button>
  </div>

  <div class="info-drawer" id="info-drawer">
    <div class="info-drawer-stack">
      <div>
        <div class="section-title">賽事播報</div>
        <div class="race-feed" id="race-feed"></div>
      </div>

      <div id="breed-section">
        <div class="section-title">交配所</div>
        <div class="breeding-panel" id="breeding-panel">
          <div class="breed-grid">
            <div>
              <div class="breed-col-title">選擇已完賽馬匹</div>
              <div class="breed-list" id="breed-primary-list"></div>
            </div>
            <div id="breed-step2">
              <div class="breed-col-title" id="breed-step2-title">選擇配對對象</div>
              <div class="breed-list" id="breed-secondary-list"></div>
            </div>
          </div>
          <div class="breed-pair-display" id="breed-pair-display"></div>
          <div id="vet-advice-block" class="vet-advice" style="display:none"></div>
          <div class="breed-actions">
            <button class="breed-btn" id="breed-btn" disabled>交配</button>
            <button class="breed-btn" id="breed-all-btn" disabled>智能交配</button>
          </div>
        </div>
      </div>

      <div id="market-section">
        <div class="section-header">
          <div class="section-title">黑市 <span id="market-gold" style="font-size:12px;font-weight:400;color:var(--gold);font-family:var(--font-mono);margin-left:6px;"></span></div>
          <button class="buy-btn" id="buy-all-market-btn" disabled>全體購買</button>
        </div>
        <div class="market-list" id="market-list"></div>
      </div>

      <div>
        <div class="section-title">紀錄</div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>

  <div id="ragnarok-banner" class="ragnarok-banner" style="display:none"></div>
</div>

<div class="fab-actions">
  <button class="fab-omni state-race" id="fab-omni">全體出戰</button>
  <button class="fab-next" id="fab-next">下一年</button>
</div>

<div id="choice-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="choice-modal-title">三 選 一</span>
    </div>
    <div class="modal-body">
      <div class="choice-cards" id="choice-cards"></div>
    </div>
  </div>
</div>

<div id="horse-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">馬 匹 清 單</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="active">現役馬廄</button>
      <button class="modal-tab" data-tab="souls">靈魂區</button>
      <button class="modal-tab" data-tab="pool">育種資料庫</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="race-anim-overlay" class="race-anim-overlay">
  <div class="race-anim-box">
    <div class="race-anim-header" id="race-anim-header"></div>
    <div class="race-anim-track"  id="race-anim-track"></div>
    <div class="race-anim-events" id="race-anim-events"></div>
    <div class="race-anim-controls">
      <span id="race-anim-result"></span>
      <button class="race-skip-btn" id="race-skip-btn">跳過 ▶▶</button>
    </div>
  </div>
</div>

<!-- Load order: names → card → data → game → render. data/game/render share global lexical scope so const/let cross files; render.js calls init() at end. -->
<script src="names.js"></script>
<script src="card.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="render.js"></script>
</body>
</html>
