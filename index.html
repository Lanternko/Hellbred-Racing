<script>

  const ENEMY_NAMES = [
    '鬼面', '渡鴉', '夜叉', '魔僕', '無常',
    '獄卒', '咆哮', '炎魔', '邪光', '骨刃',
    '腐骸', '黑焰', '殞靈', '夜梟', '幽煞'
  ];

  const STATE_FOAL = 'foal';
  const STATE_PEAK = 'peak';
  const STATE_RETIRED = 'retired';
  const STATE_LABEL = { foal: '幼駒', peak: '巔峰', retired: '退役' };

  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const randInt = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function statusFromAge(age) {
    if (age <= 0) return STATE_FOAL;
    if (age <= 4) return STATE_PEAK;
    return STATE_RETIRED;
  }

  function newHorseName(origin) {
    const o = origin || randomOrigin();
    return { ...generateHorseName(o), origin: o };
  }

  const BLUE_IDS = ['B01','B02','B03','B04','B05','B06','B07','B08'];
  const RED_IDS  = ['R01','R02','R03','R04','R05','R06'];

  function makeHorse({ age = 0 } = {}) {
    const a = Math.max(0, Math.floor(age));
    const recessiveFlags = Math.random() < 0.6 ? [pick(BLUE_IDS)] : [];
    const displayed = Math.random() < 0.08 ? [{ id: pick(RED_IDS), type:'red' }] : [];
    const origin = randomOrigin();
    const { surname, givenName, name } = generateHorseName(origin);
    return {
      id: (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()),
      origin, surname, givenName, name,
      gender: Math.random() < 0.5 ? 'male' : 'female',
      age: a,
      speed: clamp(randInt(30, 70), 1, 100),
      power: clamp(randInt(30, 70), 1, 100),
      stamina: clamp(randInt(30, 70), 1, 100),
      status: statusFromAge(a),
      racedThisTurn: false,
      bredThisTurn: false,
      skill: null,
      traits: { displayed, recessiveFlags },
      marks: [],
      marksRecessive: [],
      parents: null,
    };
  }

  function effectiveStat(h, stat) {
    return h[stat] + (h.skill && h.skill.stat === stat ? h.skill.bonus : 0);
  }
  function totalStats(h) {
    return effectiveStat(h, 'speed') + effectiveStat(h, 'power') + effectiveStat(h, 'stamina');
  }

  function makeEnemy() {
    const turn = game.yearsElapsed / game.yearPerTurn;
    const base = Math.floor(turn * 1.5);
    const stat = () => clamp(randInt(20 + base, 40 + base), 1, 100);
    return {
      name: pick(ENEMY_NAMES),
      speed: stat(),
      power: stat(),
      stamina: stat()
    };
  }

  function makeMarket() {
    // 保證至少 1 公 1 母，其餘隨機
    const horses = [makeMarketHorse('male'), makeMarketHorse('female')];
    for (let i = 2; i < 4; i++) horses.push(makeMarketHorse());
    return horses.sort(() => Math.random() - 0.5); // 隨機排序避免公馬永遠在前
  }

  function makeMarketHorse(forcedGender) {
    const turn = game.yearsElapsed / game.yearPerTurn;
    const lo = Math.min(35 + Math.floor(turn), 60);
    const hi = Math.min(70 + Math.floor(turn), 95);
    const stat = () => clamp(randInt(lo, hi), 1, 100);
    const speed = stat(), power = stat(), stamina = stat();
    const mAge = randInt(1, 4);
    const mOrigin = randomOrigin();
    const { surname: mSurname, givenName: mGiven, name: mName } = generateHorseName(mOrigin);
    const mSkill = Math.random() < 0.15 ? pick(SKILL_LIST) : null;
    const mOvr = Math.round((speed + power + stamina) / 3);
    const skillBonus = mSkill ? 3 : 0;
    return {
      id: (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()),
      origin: mOrigin, surname: mSurname, givenName: mGiven, name: mName,
      gender: forcedGender || (Math.random() < 0.5 ? 'male' : 'female'),
      age: mAge,
      speed, power, stamina,
      status: statusFromAge(mAge),
      racedThisTurn: false,
      bredThisTurn: false,
      price: Math.max(1, Math.round(mOvr * (5 - mAge) / 20) + skillBonus + randInt(0, 2)),
      skill: mSkill,
      traits: (() => {
        const allPool = [...BLUE_IDS.map(id=>({id,type:'blue'})), ...RED_IDS.map(id=>({id,type:'red'}))];
        const displayed = Math.random() < 0.35 ? [pick(allPool)] : [];
        return { displayed, recessiveFlags: [pick(BLUE_IDS)] };
      })(),
      marks: [],
      marksRecessive: [],
    };
  }

  const STAT_LABEL = { speed: '速度', power: '力量', stamina: '體力' };
  const ATTR_LABEL = { Normal: '一般', Fire: '烈焰', Ice: '冰川', Sand: '沙漠', All: '全場地' };
  const FOUR_KINGS = [
    { name: '炎獄王',   speed: 85, power: 65, stamina: 70 }, // OVR 73
    { name: '冥府王',   speed: 65, power: 88, stamina: 70 }, // OVR 74
    { name: '血戰王',   speed: 70, power: 75, stamina: 90 }, // OVR 78
    { name: '千年魔王', speed: 90, power: 90, stamina: 90 }, // OVR 90
  ];
  const SKILL_LIST = [
    { name: '疾風', stat: 'speed',   bonus: 15 },
    { name: '霸力', stat: 'power',   bonus: 15 },
    { name: '鋼魂', stat: 'stamina', bonus: 15 },
  ];
  const MUTATION_RATE = 0.10;
  const DEGENERATION_RATE = 0.05;
  const POPULATION_MEAN = 50;
  const REGRESSION_PULL = 0.2;
  const BREED_NOISE = 20;

  const TRAIT_DATA = {
    B01: { id:'B01', type:'blue', name:'火足',       desc:'火焰賽道戰力 +8%' },
    B02: { id:'B02', type:'blue', name:'長毛',       desc:'冰雪賽道戰力 +8%' },
    B03: { id:'B03', type:'blue', name:'駱駝',       desc:'沙漠賽道戰力 +8%' },
    B04: { id:'B04', type:'blue', name:'神山',       desc:'爬山地形戰力 +10%' },
    B05: { id:'B05', type:'blue', name:'GTR',        desc:'長平原地形戰力 +10%' },
    B06: { id:'B06', type:'blue', name:'越野',       desc:'起伏地形戰力 +10%' },
    B07: { id:'B07', type:'blue', name:'全能',       desc:'每持有 1 個其他藍特，戰力額外 +3%' },
    B08: { id:'B08', type:'blue', name:'繁殖專家',   desc:'交配時藍特繼承率提升（單親 50→80%、雙親 70→85%）' },
    R01: { id:'R01', type:'red',  name:'燃盡',     desc:'每場出賽後速度永久 -1' },
    R02: { id:'R02', type:'red',  name:'玻璃骨',   desc:'非對應賽道戰力 -20%' },
    R03: { id:'R03', type:'red',  name:'玻璃心',   desc:'大典必敗，無視戰力' },
    R04: { id:'R04', type:'red',  name:'孤傲',     desc:'參賽時自身所有特性效果失效（仍可遺傳）' },
    R05: { id:'R05', type:'red',  name:'短命血統', desc:'壽命縮短，Age 4 直接死亡' },
    R06: { id:'R06', type:'red',  name:'暴食',     desc:'每年消耗 80G 飼料費' },
    G01: { id:'G01', type:'gold', name:'地獄之王', desc:'Ragnarök 中所有屬性視為匹配' },
    G02: { id:'G02', type:'gold', name:'鳳凰之血', desc:'死亡時 30% 機率以幼駒姿態重生（一次性）' },
  };

  const MARK_DATA = {
    M01: { id:'M01', name:'無瑕之眼', desc:'速度上限突破至 115（即刻 +15、上限 100→115）' },
    M02: { id:'M02', name:'戰神血脈', desc:'大典中三圍視為 +10（速/力/體 各 +10）' },
  };
  const MARK_IDS = ['M01', 'M02'];

  const EVENT_CARDS = [
    { id:'E_B01', kind:'trait', traitId:'B01', title:'火足傳承', desc:'將藍特「火足」(火焰賽道+8%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B02', kind:'trait', traitId:'B02', title:'長毛傳承', desc:'將藍特「長毛」(冰雪賽道+8%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B03', kind:'trait', traitId:'B03', title:'駱駝傳承', desc:'將藍特「駱駝」(沙漠賽道+8%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B04', kind:'trait', traitId:'B04', title:'神山傳承', desc:'將藍特「神山」(爬山地形+10%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B05', kind:'trait', traitId:'B05', title:'GTR傳承',  desc:'將藍特「GTR」(長平原+10%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_B06', kind:'trait', traitId:'B06', title:'越野傳承', desc:'將藍特「越野」(起伏地形+10%) 賜予馬廄 OVR 最高的馬。' },
    { id:'E_RARE', kind:'marketBuff', title:'稀有馬場', desc:'下一年的黑市馬匹三圍全部 +15。' },
    { id:'E_GOLD', kind:'gold', amount:5, title:'黃金祭壇', desc:'立即獲得 5G。' },
  ];

  function makeEventChoice() {
    // 從 EVENT_CARDS pool 抽 3 張不重覆
    const pool = [...EVENT_CARDS];
    const cards = [];
    for (let i = 0; i < 3 && pool.length; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      cards.push(pool.splice(idx, 1)[0]);
    }
    return { kind: 'event', cards };
  }

  function applyChoiceCard(card) {
    if (card.kind === 'trait') {
      // 套用至 OVR 最高且尚未持有此特性的現役馬
      const candidates = game.horses
        .filter(h => h.traits && !h.traits.displayed.some(t => t.id === card.traitId))
        .sort((a, b) => ovrOf(b) - ovrOf(a));
      if (!candidates.length) {
        addLog(`活動「${card.title}」無對象可施加（馬廄空或全員已有此特性）`, 'death');
        return;
      }
      const target = candidates[0];
      target.traits.displayed.push({ id: card.traitId, type: 'blue' });
      addLog(`活動「${card.title}」→ ${target.name} 獲得藍特：${TRAIT_DATA[card.traitId].name}`, 'soul');
    } else if (card.kind === 'marketBuff') {
      game.nextMarketBuff = true;
      addLog(`活動「${card.title}」→ 下一年黑市馬匹 +15 三圍`, 'soul');
    } else if (card.kind === 'gold') {
      game.money += card.amount;
      addLog(`活動「${card.title}」→ 獲得 ${card.amount}G`, 'soul');
    }
  }

  function makeMarkChoice(winnerHorse) {
    // 從 MARK_IDS 排除馬已持有的，最多 3 張（目前池子只有 2 張，所以是 0/1/2）
    const owned = new Set((winnerHorse.marks || []).map(m => m.id));
    const available = MARK_IDS.filter(id => !owned.has(id));
    if (!available.length) return null;
    const cards = available.map(id => ({
      id: 'MARK_' + id,
      kind: 'mark',
      markId: id,
      horseId: winnerHorse.id,
      title: MARK_DATA[id].name,
      desc: MARK_DATA[id].desc,
    }));
    return { kind: 'mark', cards, context: { horseId: winnerHorse.id } };
  }

  function awardMark(horse, markId) {
    if (!horse.marks) horse.marks = [];
    if (!horse.marksRecessive) horse.marksRecessive = [];
    if (horse.marks.length >= 1) return; // 每馬最多 1 印記
    horse.marks.push({ id: markId });
    // 即時效果
    if (markId === 'M01') {
      // 無瑕之眼：speed +15，cap 提升至 115
      horse.speed = Math.min(115, horse.speed + 15);
    }
    addLog(`✨ ${horse.name} 獲得印記：${MARK_DATA[markId].name}`, 'soul');
  }

  function speedCapOf(horse) {
    return horse.marks && horse.marks.some(m => m.id === 'M01') ? 115 : 100;
  }

  const RACE_TYPES = [
    { name:'冥原衝刺', attr:'Normal', terrain:'長平原'  },
    { name:'烈焰賽道', attr:'Fire',   terrain:'長平原'  },
    { name:'冰川之路', attr:'Ice',    terrain:'起伏不定'},
    { name:'沙漠突圍', attr:'Sand',   terrain:'長平原'  },
    { name:'魔山登頂', attr:'Normal', terrain:'爬山'    },
    { name:'地獄起伏', attr:'Fire',   terrain:'起伏不定'},
  ];

  const VET_LINES = {
    goldResonance:{ text:'……老夫行醫數千年，僅見過寥寥數次這種血統共鳴。\n不敢妄言，但請務必好好珍惜這一胎。', sev:'gold' },
    redDouble:    { text:'老夫有句話不得不說……這對血統曾令老夫見過慘烈的結局。\n子代或將承受難以擺脫的詛咒，還請三思。', sev:'high' },
    redSingle:    { text:'此方血液中有些令老夫不安的氣息。\n子代或許會繼承某種難以克服的弱點。', sev:'medium' },
    recessiveB01: { text:'血統中似乎潛藏著與烈火親近的因子。\n若子代繼承，在特定賽道或有驚人表現。', sev:'' },
    recessiveB02: { text:'隱約感受到冰雪血脈的共鳴。\n子代或許天生適應嚴寒之地。', sev:'' },
    recessiveB03: { text:'沙塵的氣息在血統中流動。\n子代在荒漠賽道或有超乎預期的發揮。', sev:'' },
    recessiveB04: { text:'骨骼結構頗為紮實，山地血統的印記清晰可見。\n爬坡或是此子天生的舞台。', sev:'' },
    recessiveB05: { text:'四肢比例修長，有平原疾馳者的血統輪廓。\n長直賽道或能見到此子的真正速度。', sev:'' },
    recessiveB06: { text:'重心極低，對起伏地形有天然的適應傾向。\n或許能在最複雜的賽道中找到節奏。', sev:'' },
    recessiveB07: { text:'血脈中似乎潛藏著某種「共鳴」之力。\n若子代繼承且擁有多個天賦，將彼此放大。', sev:'' },
    recessiveB08: { text:'此血脈生機旺盛，傳承之力勝於常理。\n子代或將更完整地承繼父母的隱性天賦。', sev:'' },
    highDiff:     { text:'血統差異顯著，子代走向難以預測。\n然而，老夫見過最驚人的突破，往往來自這樣的配對。', sev:'' },
    lowDiff:      { text:'兩者血統過於相近，子代恐怕難有突破。\n突變，是唯一的希望。', sev:'' },
    normal:       { text:'這對配對血統相性尚可。\n子代應能穩定繼承雙親之長。', sev:'' },
  };

  function getVetAdvice(father, mother) {
    if (!father || !mother) return null;
    const fReds = father.traits.displayed.filter(t => t.type === 'red');
    const mReds = mother.traits.displayed.filter(t => t.type === 'red');
    if (fReds.find(ft => mReds.some(mt => mt.id === ft.id))) return VET_LINES.redDouble;
    if (fReds.length || mReds.length) return VET_LINES.redSingle;
    const fPool = new Set([
      ...father.traits.recessiveFlags,
      ...father.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
    const mPool = new Set([
      ...mother.traits.recessiveFlags,
      ...mother.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
    const shared = [...fPool].find(id => mPool.has(id));
    if (shared && VET_LINES['recessive' + shared]) return VET_LINES['recessive' + shared];
    const avgDiff = (Math.abs(father.speed - mother.speed) +
                    Math.abs(father.power  - mother.power)  +
                    Math.abs(father.stamina- mother.stamina)) / 3;
    if (avgDiff > 30) return VET_LINES.highDiff;
    if (avgDiff < 10) return VET_LINES.lowDiff;
    return VET_LINES.normal;
  }

  function breedTraits(father, mother) {
    const displayed = [];
    const recessiveFlags = [];
    const addD = t => { if (!displayed.some(x => x.id === t.id)) displayed.push(t); };
    const addR = id => { if (!recessiveFlags.includes(id)) recessiveFlags.push(id); };

    const fBlues = new Set([
      ...father.traits.recessiveFlags,
      ...father.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
    const mBlues = new Set([
      ...mother.traits.recessiveFlags,
      ...mother.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
    const b08Boost =
      father.traits.displayed.some(t => t.id === 'B08') ||
      mother.traits.displayed.some(t => t.id === 'B08');
    const bothRate   = b08Boost ? 0.85 : 0.70;
    const singleRate = b08Boost ? 0.80 : 0.50;
    for (const id of new Set([...fBlues, ...mBlues])) {
      if (fBlues.has(id) && mBlues.has(id)) {
        Math.random() < bothRate ? addD({ id, type:'blue' }) : addR(id);
      } else if (Math.random() < singleRate) {
        addR(id);
      }
    }

    const allRedIds = new Set([
      ...father.traits.displayed.filter(t => t.type === 'red').map(t => t.id),
      ...mother.traits.displayed.filter(t => t.type === 'red').map(t => t.id),
    ]);
    for (const id of allRedIds) {
      const fH = father.traits.displayed.some(t => t.id === id);
      const mH = mother.traits.displayed.some(t => t.id === id);
      if (Math.random() < (fH && mH ? 0.85 : 0.55)) addD({ id, type:'red' });
    }

    if (Math.random() < 0.03) {
      const newRed = pick(RED_IDS);
      if (!displayed.some(t => t.id === newRed)) addD({ id: newRed, type:'red' });
    }

    const goldTriggered = Math.random() < 0.02;
    if (goldTriggered) {
      addD({ id: Math.random() < 0.5 ? 'G01' : 'G02', type:'gold' });
    }
    return { displayed, recessiveFlags, goldTriggered };
  }

  function breedMarks(father, mother) {
    // A 型隱性：雙親同印記 70% 顯現；單親持有 50% 隱性傳遞。每馬 max 1 顯性。
    const displayed = [];
    const recessive = [];
    const fMarks = new Set([
      ...((father.marks || []).map(m => m.id)),
      ...((father.marksRecessive || [])),
    ]);
    const mMarks = new Set([
      ...((mother.marks || []).map(m => m.id)),
      ...((mother.marksRecessive || [])),
    ]);
    for (const id of new Set([...fMarks, ...mMarks])) {
      if (fMarks.has(id) && mMarks.has(id)) {
        if (Math.random() < 0.70 && displayed.length < 1) {
          displayed.push({ id });
        } else {
          recessive.push(id);
        }
      } else if (Math.random() < 0.50) {
        recessive.push(id);
      }
    }
    return { displayed, recessive };
  }

  function applyTraitMultiplier(horse, attr, terrain) {
    const d = horse.traits ? horse.traits.displayed : [];
    if (d.some(t => t.id === 'R04')) return 1.0;
    let m = 1.0;
    if (attr === 'Fire' && d.some(t => t.id === 'B01')) m += 0.08;
    if (attr === 'Ice'  && d.some(t => t.id === 'B02')) m += 0.08;
    if (attr === 'Sand' && d.some(t => t.id === 'B03')) m += 0.08;
    if (terrain === '爬山'     && d.some(t => t.id === 'B04')) m += 0.10;
    if (terrain === '長平原'   && d.some(t => t.id === 'B05')) m += 0.10;
    if (terrain === '起伏不定' && d.some(t => t.id === 'B06')) m += 0.10;
    if (d.some(t => t.id === 'B07')) {
      const otherBlue = d.filter(t => t.type === 'blue' && t.id !== 'B07').length;
      m += 0.03 * otherBlue;
    }
    if (d.some(t => t.id === 'R02')) {
      const matches = attr === 'Normal' ||
        (attr === 'Fire' && d.some(t => t.id === 'B01')) ||
        (attr === 'Ice'  && d.some(t => t.id === 'B02')) ||
        (attr === 'Sand' && d.some(t => t.id === 'B03'));
      if (!matches) m -= 0.20;
    }
    return m;
  }

  const ovrOf = h => Math.round(totalStats(h) / 3);

  const game = {
    yearsElapsed: 0,
    maxYears: 30000,
    yearPerTurn: 1000,
    money: 10,
    horses: [],
    souls: [],
    market: [],
    races: [],
    log: [],
    stableExpanded: false,
    infoDrawerOpen: false,
    currentTurnMajor: false,
    currentTurnPhase: 'race', // 'event' | 'race' | 'major'
    ragnarok: null,
    breedPrimaryId: null,
    breedSecondaryId: null,
    stableSize: 6,
    bench: [],
    subPhase: null, // 'roster' | 'racing' | 'breeding' | null (event turn)
    currentRace: null, // { name, attr, terrain } — 整年共用同一賽道，event turn 為 null
    batchRacedThisTurn: false,
    nextMarketBuff: false,
    pendingChoice: null, // { kind: 'event'|'mark', cards: [...], context: {...} }
    pendingChoiceQueue: [],
    settings: { animationsEnabled: true },
  };

  function allOwnedHorses() {
    return [...game.horses, ...game.bench];
  }

  function pushPending(choice) {
    if (!choice) return;
    if (!game.pendingChoice) game.pendingChoice = choice;
    else game.pendingChoiceQueue.push(choice);
  }
  function resolvePending() {
    game.pendingChoice = game.pendingChoiceQueue.shift() || null;
  }

  function init() {
    game.horses = [
      makeHorse({ age: 0 }),
      makeHorse({ age: 1 }),
      makeHorse({ age: 3 })
    ];
    game.market = makeMarket();
    addLog(`第 0 年 · 馬廄入駐 ${game.horses.length} 匹馬，等候惡魔之王的審判。`);
    render();
  }

  function ageAllHorses() {
    for (const h of allOwnedHorses()) {
      h.age += 1;
      h.status = statusFromAge(h.age);
    }
    let foodCost = 0;
    const foodEaters = [];
    for (const h of allOwnedHorses()) {
      if (h.traits && h.traits.displayed.some(t => t.id === 'R06')) {
        foodCost += 1;
        foodEaters.push(h.name);
      }
    }
    if (foodCost > 0) {
      game.money = Math.max(0, game.money - foodCost);
      addLog(`暴食特性 −${foodCost}G 飼料費（${foodEaters.join('、')}）`, 'death');
    }
    const ascending = [];
    const reborn = [];
    const ageOutFromArray = (arr) => {
      for (let i = arr.length - 1; i >= 0; i--) {
        const h = arr[i];
        const hasR05 = h.traits && h.traits.displayed.some(t => t.id === 'R05');
        if (h.age >= (hasR05 ? 4 : 5)) {
          const hasG02 = h.traits && h.traits.displayed.some(t => t.id === 'G02');
          if (hasG02 && Math.random() < 0.30) {
            h.age = 0;
            h.status = STATE_FOAL;
            h.racedThisTurn = false;
            h.bredThisTurn = false;
            h.traits.displayed = h.traits.displayed.filter(t => t.id !== 'G02');
            reborn.push(h.name);
          } else {
            ascending.push(arr.splice(i, 1)[0]);
          }
        }
      }
    };
    ageOutFromArray(game.horses);
    ageOutFromArray(game.bench);
    if (reborn.length) {
      addLog(`🔥 鳳凰之血燃燒：${reborn.join('、')} 以幼駒姿態重生！`, 'soul');
    }
    if (ascending.length) {
      game.souls.push(...ascending);
      addLog(`升入靈魂區：${ascending.map(h => h.name).join('、')}`, 'soul');
    }
    promoteFromBench();
  }

  function nextTurn() {
    if (game.yearsElapsed >= game.maxYears) return;
    game.yearsElapsed += game.yearPerTurn;
    window.scrollTo({ top: 0, behavior: 'smooth' });

    const currentTurn = game.yearsElapsed / game.yearPerTurn;
    const phaseInCycle = ((currentTurn - 1) % 6) + 1; // 1..6
    if (phaseInCycle === 6) {
      game.currentTurnPhase = 'major';
      game.currentTurnMajor = true;
    } else if (phaseInCycle === 3) {
      game.currentTurnPhase = 'race';
      game.currentTurnMajor = false;
    } else {
      game.currentTurnPhase = 'event';
      game.currentTurnMajor = false;
    }
    if (currentTurn % 6 === 0) {
      game.stableSize += 1;
      addLog(`🏛 馬廄擴建 → ${game.stableSize} 格`, 'soul');
    }

    game.batchRacedThisTurn = false;

    for (const h of allOwnedHorses()) {
      h.racedThisTurn = false;
      h.bredThisTurn = false;
    }

    const buffApplied = game.nextMarketBuff;
    game.market = makeMarket();
    if (buffApplied) {
      game.market.forEach(m => {
        m.speed = clamp(m.speed + 15, 1, 100);
        m.power = clamp(m.power + 15, 1, 100);
        m.stamina = clamp(m.stamina + 15, 1, 100);
        const mOvr = Math.round((m.speed + m.power + m.stamina) / 3);
        const skillBonus = m.skill ? 3 : 0;
        m.price = Math.max(1, Math.round(mOvr * (5 - m.age) / 20) + skillBonus + randInt(0, 2));
        m._rare = true;
      });
      addLog(`✨ 稀有馬場開張 · 黑市馬匹三圍 +15`, 'soul');
      game.nextMarketBuff = false;
    }

    const phaseTag = game.currentTurnPhase === 'major' ? '〔大典〕 '
                   : game.currentTurnPhase === 'race'  ? '〔小賽事〕 '
                   : '〔活動〕 ';
    addLog(`${phaseTag}第 ${currentTurn} 年 · 一年過去。`);

    if (game.currentTurnPhase === 'event') {
      game.subPhase = null;
      game.currentRace = null;
      pushPending(makeEventChoice()); // 老化延遲到玩家選完卡片後（pickChoiceCard）
    } else {
      game.subPhase = 'roster';
      game.currentRace = pick(RACE_TYPES);
      // 賽事回合：老化延遲到賽事結束後（advanceFromRacing），讓馬先比賽再退役
    }

    if (game.yearsElapsed >= game.maxYears) {
      addLog(`時辰已盡 · 30 年皆已過去。`);
    }
    render();
  }

  function promoteFromBench() {
    // 老化後若 active 有空位，從 bench 補強（OVR 高優先），不是強制 — 玩家仍可手動換場
    while (game.horses.length < game.stableSize && game.bench.length) {
      game.bench.sort((a, b) => ovrOf(b) - ovrOf(a));
      game.horses.push(game.bench.shift());
    }
  }

  function moveToBench(horseId) {
    const idx = game.horses.findIndex(h => h.id === horseId);
    if (idx < 0) return;
    game.bench.push(game.horses.splice(idx, 1)[0]);
    render();
  }
  function moveToRoster(horseId) {
    if (game.horses.length >= game.stableSize) {
      addLog(`先發名單已滿（${game.stableSize}/${game.stableSize}），請先下放某匹再上場。`, 'death');
      render();
      return;
    }
    const idx = game.bench.findIndex(h => h.id === horseId);
    if (idx < 0) return;
    game.horses.push(game.bench.splice(idx, 1)[0]);
    render();
  }
  function advanceFromRoster() {
    if (game.subPhase !== 'roster') return;
    game.subPhase = 'racing';
    if (getRaceBatch().length === 0) {
      // 無 PEAK 馬可參賽 → 跳過直接到育馬
      advanceFromRacing();
    } else {
      render();
    }
  }
  function advanceFromRacing() {
    if (game.subPhase !== 'racing') return;
    ageAllHorses(); // 賽事結束才老化，確保 age-4 馬能出賽後才退役
    game.subPhase = 'breeding';
    render();
  }

  function getRaceBatch() {
    if (game.currentTurnPhase === 'event') return [];
    if (game.subPhase && game.subPhase !== 'racing') return [];
    const eligible = game.horses.filter(h => h.status === STATE_PEAK && !h.racedThisTurn);
    if (!game.currentTurnMajor) return eligible;
    const racedCount = game.horses.filter(h => h.racedThisTurn).length;
    const slots = Math.max(0, 2 - racedCount);
    return [...eligible].sort((a, b) => ovrOf(b) - ovrOf(a)).slice(0, slots);
  }

  function getAffordableMarketCount() {
    return game.market.filter(m => game.money >= m.price).length;
  }

  function runAllRaces() {
    if (game.subPhase !== 'racing') return;
    const batch = getRaceBatch();
    if (!batch.length) { advanceFromRacing(); return; }

    if (game.currentTurnMajor && game.settings.animationsEnabled) {
      function next(remaining) {
        if (!remaining.length) {
          game.batchRacedThisTurn = true;
          advanceFromRacing();
          return;
        }
        runRace(remaining[0].id, () => next(remaining.slice(1)));
      }
      next(batch);
    } else {
      batch.forEach(h => runRace(h.id));
      game.batchRacedThisTurn = true;
      advanceFromRacing();
    }
  }

  function buyMarketHorse(marketId) {
    if (!['roster', 'racing', 'breeding'].includes(game.subPhase)) return;
    const idx = game.market.findIndex(m => m.id === marketId);
    if (idx < 0) return;
    const horse = game.market[idx];
    if (game.money < horse.price) return;
    const price = horse.price;
    delete horse.price;
    game.money -= price;
    const benched = game.horses.length >= game.stableSize;
    if (benched) {
      game.bench.push(horse);
    } else {
      game.horses.push(horse);
    }
    game.market.splice(idx, 1);
    addLog(`購入：${horse.name}（${horse.gender === 'male' ? '公' : '母'}） −${price.toLocaleString()}G${benched ? '〔送往替補席〕' : ''}`);
    render();
  }

  let __cardSilent = false;
  function breed(fatherId, motherId, primaryId) {
    if (game.subPhase !== 'breeding') return null;
    const allBreedable = [...game.horses, ...game.bench];
    const father = allBreedable.find(h => h.id === fatherId);
    const mother = allBreedable.find(h => h.id === motherId);
    if (!father || !mother) return null;
    if (father.age < 1 || father.age > 4 || mother.age < 1 || mother.age > 4) return null;
    if (father.gender !== 'male' || mother.gender !== 'female') return null;
    // 只有主動交配的一方需要當年參賽過
    const primary = allBreedable.find(h => h.id === primaryId) || father;
    if (!primary.racedThisTurn) {
      if (!__cardSilent) addLog(`主動交配的馬匹必須在當年參賽過。`, 'death');
      return null;
    }
    // 公馬作為主動方時每年只能交配一次
    if (father.id === primary.id && father.bredThisTurn) {
      if (!__cardSilent) addLog(`公馬 ${father.name} 當年已交配過 1 胎。`, 'death');
      return null;
    }

    const events = [];
    const mutated = { speed: false, power: false, stamina: false };
    const breedStat = (key) => {
      const midpoint = (father[key] + mother[key]) / 2;
      const regressed = midpoint * (1 - REGRESSION_PULL) + POPULATION_MEAN * REGRESSION_PULL;
      const noise = (Math.random() - 0.5) * BREED_NOISE;
      let stat = regressed + noise;
      const roll = Math.random();
      if (roll < MUTATION_RATE) {
        events.push(`${STAT_LABEL[key]}突變+20`);
        mutated[key] = true;
        stat += 20;
      } else if (roll < MUTATION_RATE + DEGENERATION_RATE) {
        events.push(`${STAT_LABEL[key]}劣化-15`);
        stat -= 15;
      }
      return clamp(Math.round(stat), 1, 100);
    };

    const childTraits = breedTraits(father, mother);
    const childMarks = breedMarks(father, mother);
    const cOrigin = childOrigin(father, mother, ovrOf);
    const { surname: cSurname, givenName: cGiven, name: cName } = generateChildName(father, mother, cOrigin, ovrOf);
    const child = {
      id: (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()),
      origin: cOrigin, surname: cSurname, givenName: cGiven, name: cName,
      gender: Math.random() < 0.5 ? 'male' : 'female',
      age: 0,
      speed: breedStat('speed'),
      power: breedStat('power'),
      stamina: breedStat('stamina'),
      status: STATE_FOAL,
      racedThisTurn: false,
      bredThisTurn: false,
      mutated,
      skill: null,
      traits: { displayed: childTraits.displayed, recessiveFlags: childTraits.recessiveFlags },
      marks: childMarks.displayed,
      marksRecessive: childMarks.recessive,
      parents: {
        father: { id: father.id, name: father.name, ovr: ovrOf(father), origin: father.origin },
        mother: { id: mother.id, name: mother.name, ovr: ovrOf(mother), origin: mother.origin },
      },
    };
    const parentSkills = [father.skill, mother.skill].filter(Boolean);
    if (parentSkills.length && Math.random() < 0.5) {
      child.skill = pick(parentSkills);
    }

    // 印記顯性遺傳的即時效果（M01 立即 +15 速度）
    if (child.marks.some(m => m.id === 'M01')) {
      child.speed = Math.min(115, child.speed + 15);
    }

    // 子代當年不能參賽、不能交配
    child.racedThisTurn = true;
    child.bredThisTurn = true;
    if (game.horses.length < game.stableSize) {
      game.horses.push(child);
    } else {
      game.bench.push(child);
    }
    primary.bredThisTurn = true; // 只有主動方計入一胎/年

    const eventStr = events.length ? `〔${events.join('、')}〕` : '';
    const skillInherit = child.skill ? ` 繼承技能：${child.skill.name}` : '';
    const goldTag = childTraits.goldTriggered ? ' ✨【地獄之王】降臨！' : '';
    const traitNames = childTraits.displayed.filter(t => t.type !== 'gold').map(t => TRAIT_DATA[t.id]?.name).filter(Boolean);
    const traitTag = traitNames.length ? ` 特性：${traitNames.join('、')}` : '';
    const markNames = child.marks.map(m => MARK_DATA[m.id]?.name).filter(Boolean);
    const markTag = markNames.length ? ` ✨印記：${markNames.join('、')}` : '';
    addLog(`交配：${father.name} × ${mother.name} → ${child.name}（${child.gender === 'male' ? '公' : '母'}） ${eventStr}${skillInherit}${traitTag}${goldTag}${markTag}`, (goldTag || markTag) ? 'soul' : '');
    render();
    if (!__cardSilent && typeof window.openHorseCard === 'function') {
      const lucky = typeof window.isLuckyBirth === 'function' && window.isLuckyBirth(child);
      window.openHorseCard(child, { reveal: true, lucky });
    }
    return child;
  }

  // ── Stage F: tick-based 賽事引擎 ────────────────────────────────────

  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function getSegType(p) {
    if (p < 0.20) return 'start';
    if (p < 0.60) return 'straight';
    if (p < 0.85) return 'curve';
    return 'final';
  }

  function simulateRaceMatch(horse, opponent, context) {
    const { isMajor, raceType } = context;
    const seed = context.seed != null ? context.seed : (Math.random() * 0x7FFFFFFF | 0);
    const rng = mulberry32(seed);
    const TICKS = 60;

    const hasR04 = horse.traits?.displayed.some(t => t.id === 'R04');
    const hasR03 = isMajor && horse.traits?.displayed.some(t => t.id === 'R03');
    const traitMul = hasR04 ? 1.0 : applyTraitMultiplier(horse, raceType.attr, raceType.terrain);
    const r12Mul = (() => {
      if (hasR04 || !horse.traits?.displayed.some(t => t.id === 'R12')) return 1.0;
      const maxOvr = Math.max(...game.horses.map(ovrOf));
      return ovrOf(horse) >= maxOvr ? 1.10 : 0.90;
    })();
    const m02 = isMajor && horse.marks?.some(m => m.id === 'M02') ? 10 : 0;
    const m01Cap = horse.marks?.some(m => m.id === 'M01') ? 115 : 100;
    const hStats = {
      speed:   clamp(effectiveStat(horse, 'speed')   + m02, 1, m01Cap),
      power:   clamp(effectiveStat(horse, 'power')   + m02, 1, 100),
      stamina: clamp(effectiveStat(horse, 'stamina') + m02, 1, 100),
    };
    const eStats = { speed: opponent.speed, power: opponent.power, stamina: opponent.stamina };
    const hMul = hasR03 ? 0.01 : traitMul * r12Mul;

    function delta(stats, mul, t) {
      const ability = (stats.speed * 0.6 + stats.power * 0.4) / 100;
      const target  = 90 - ability * 45;
      const stam    = Math.max(0.5, 1 - (t / TICKS) * (1 - stats.stamina / 100) * 0.8);
      return (1 / target) * stam * mul * (0.93 + rng() * 0.14);
    }

    let hP = 0, eP = 0, finishTick = null;
    const hRuntime = { g05Fired: false };
    const timeline = [];

    for (let t = 0; t <= TICKS + 10; t++) {
      const events = [];
      let hExtraMul = 1.0;

      if (!hasR04 && horse.traits?.displayed.some(x => x.id === 'G05')) {
        if (getSegType(hP) === 'final' && hP < eP - 0.15 && !hRuntime.g05Fired) {
          hExtraMul = 1.4;
          hRuntime.g05Fired = true;
          events.push('⚡ 黑馬爆發');
        }
      }

      if (hP < 1) hP = Math.min(hP + delta(hStats, hMul * hExtraMul, t), 1.005);
      if (eP < 1) eP = Math.min(eP + delta(eStats, 1.0, t), 1.005);

      timeline.push({ t, hP: Math.min(hP, 1), eP: Math.min(eP, 1), events });

      if (finishTick == null && (hP >= 1 || eP >= 1)) finishTick = t;
      if (finishTick != null && t >= finishTick + 5) break;
    }

    let won;
    if (hasR03) {
      won = false;
    } else {
      const hFi = timeline.findIndex(f => f.hP >= 1);
      const eFi = timeline.findIndex(f => f.eP >= 1);
      if (hFi < 0)      won = false;
      else if (eFi < 0) won = true;
      else              won = hFi < eFi || (hFi === eFi && timeline[hFi].hP >= timeline[eFi].eP);
    }

    return { seed, horse, opponent, isMajor, raceType, won, r03Forced: hasR03, traitMul, timeline };
  }

  function applyRaceOutcome(result) {
    const { horse, won, isMajor, raceType, r03Forced, traitMul } = result;
    const reward = won ? (isMajor ? 10 : 3) : (isMajor ? 2 : 1);
    game.money += reward;
    horse.racedThisTurn = true;

    if (horse.traits?.displayed.some(t => t.id === 'R01')) {
      horse.speed = Math.max(1, horse.speed - 1);
    }

    let newSkill = null;
    if (won && isMajor && !horse.skill) {
      const bestStat = ['speed', 'power', 'stamina'].reduce((a, b) => horse[a] > horse[b] ? a : b);
      newSkill = SKILL_LIST.find(s => s.stat === bestStat) || SKILL_LIST[0];
      horse.skill = newSkill;
    }
    if (won && isMajor) {
      const markChoice = makeMarkChoice(horse);
      if (markChoice) pushPending(markChoice);
    }

    game.races.unshift({
      year: game.yearsElapsed,
      player: { name: horse.name, total: totalStats(horse), score: Math.round(ovrOf(horse)) },
      enemy:  { name: result.opponent.name, total: totalStats(result.opponent), score: Math.round(ovrOf(result.opponent)) },
      won, reward, isMajor,
      skillEarned: newSkill ? newSkill.name : null,
      raceType: raceType.name, raceAttr: raceType.attr, raceTerrain: raceType.terrain,
      traitMult: traitMul !== 1 ? traitMul : null,
    });
    if (game.races.length > 5) game.races.length = 5;

    const majorTag = isMajor    ? '〔大典〕 ' : '';
    const skillTag = newSkill   ? ` 獲得技能：${newSkill.name}` : '';
    const traitTag = traitMul !== 1 ? ` [特性×${traitMul.toFixed(2)}]` : '';
    const r03Tag   = r03Forced  ? ' 💔玻璃心崩潰' : '';
    addLog(
      `${majorTag}${raceType.name} · ${horse.name} ${won ? '擊敗' : '不敵'} ${result.opponent.name}（+${reward}G）${skillTag}${traitTag}${r03Tag}`,
      won ? '' : 'death'
    );
  }

  let _raceAnimTimer = null;
  function renderRaceReplay(result, onComplete) {
    const overlay  = document.getElementById('race-anim-overlay');
    const headerEl = document.getElementById('race-anim-header');
    const trackEl  = document.getElementById('race-anim-track');
    const eventsEl = document.getElementById('race-anim-events');
    const skipBtn  = document.getElementById('race-skip-btn');
    const { horse, opponent, won, timeline } = result;
    const currentTurn = game.yearsElapsed / game.yearPerTurn;
    const label = `第 ${currentTurn} 年 大典`;
    let tickIdx = 0;

    function buildBar(p) {
      const B = 22, f = Math.round(Math.min(p, 1) * B);
      return '▓'.repeat(f) + '░'.repeat(B - f);
    }

    function frame() {
      const tk = timeline[Math.min(tickIdx, timeline.length - 1)];
      headerEl.textContent = `${label}  ──  tick ${tk.t} / ${timeline[timeline.length-1].t}`;
      const hPct = Math.round(tk.hP * 100), ePct = Math.round(tk.eP * 100);
      const hRank = tk.hP >= tk.eP ? '1' : '2', eRank = tk.hP >= tk.eP ? '2' : '1';
      trackEl.textContent =
        `${hRank}│ ${horse.name.slice(0,8).padEnd(8)} ${buildBar(tk.hP)} ${String(hPct).padStart(3)}%\n` +
        `${eRank}│ ${opponent.name.slice(0,8).padEnd(8)} ${buildBar(tk.eP)} ${String(ePct).padStart(3)}%`;
      const recent = timeline.slice(Math.max(0, tickIdx-1), tickIdx+1).flatMap(f => f.events);
      eventsEl.textContent = recent.slice(-2).join('  ');
    }

    function finish() {
      clearInterval(_raceAnimTimer); _raceAnimTimer = null;
      const tk = timeline[timeline.length - 1];
      headerEl.textContent = `${label}  ──  ${won ? '🏆 勝利！' : '💀 落敗'}`;
      const hPct = Math.round(tk.hP * 100), ePct = Math.round(tk.eP * 100);
      trackEl.textContent =
        `${won ? '1' : '2'}│ ${horse.name.slice(0,8).padEnd(8)} ${buildBar(tk.hP)} ${String(hPct).padStart(3)}%\n` +
        `${won ? '2' : '1'}│ ${opponent.name.slice(0,8).padEnd(8)} ${buildBar(tk.eP)} ${String(ePct).padStart(3)}%`;
      skipBtn.onclick = null;
      setTimeout(() => { overlay.classList.remove('open'); onComplete(); }, 700);
    }

    skipBtn.onclick = () => {
      clearInterval(_raceAnimTimer); _raceAnimTimer = null;
      overlay.classList.remove('open');
      onComplete();
    };

    frame();
    overlay.classList.add('open');
    _raceAnimTimer = setInterval(() => {
      tickIdx++;
      if (tickIdx >= timeline.length) { finish(); return; }
      frame();
    }, 100);
  }

  function runRace(horseId, onComplete) {
    if (game.currentTurnPhase === 'event') return;
    const h = game.horses.find(x => x.id === horseId);
    if (!h || h.status !== STATE_PEAK || h.racedThisTurn) return;

    const isMajor = game.currentTurnMajor;
    if (isMajor) {
      const alreadyRaced = game.horses.filter(x => x.racedThisTurn).length;
      if (alreadyRaced >= 2) return;
    }

    const raceType = game.currentRace || pick(RACE_TYPES);
    const opponent = makeEnemy();
    const seed = Math.random() * 0x7FFFFFFF | 0;
    const result = simulateRaceMatch(h, opponent, { isMajor, raceType, seed });

    if (isMajor && game.settings.animationsEnabled) {
      renderRaceReplay(result, () => {
        applyRaceOutcome(result);
        render();
        if (onComplete) onComplete();
      });
    } else {
      applyRaceOutcome(result);
      render();
      if (onComplete) onComplete();
    }
  }

  function addLog(text, kind = '') {
    game.log.unshift({ text, kind });
    if (game.log.length > 30) game.log.length = 30;
  }

  function getBluePool(horse) {
    if (!horse.traits) return new Set();
    return new Set([
      ...horse.traits.recessiveFlags,
      ...horse.traits.displayed.filter(t => t.type === 'blue').map(t => t.id),
    ]);
  }

  function getRedIds(horse) {
    return horse.traits
      ? horse.traits.displayed.filter(t => t.type === 'red').map(t => t.id)
      : [];
  }

  function breedPairScore(father, mother) {
    const fatherBlue = getBluePool(father);
    const motherBlue = getBluePool(mother);
    const sharedBlue = [...fatherBlue].filter(id => motherBlue.has(id)).length;

    const fatherRed = getRedIds(father);
    const motherRed = getRedIds(mother);
    const sharedRed = fatherRed.filter(id => motherRed.includes(id)).length;
    const totalRed = new Set([...fatherRed, ...motherRed]).size;
    const statDiff = (
      Math.abs(father.speed - mother.speed) +
      Math.abs(father.power - mother.power) +
      Math.abs(father.stamina - mother.stamina)
    ) / 18;
    const skillBonus = (father.skill ? 5 : 0) + (mother.skill ? 4 : 0);
    return (
      ovrOf(father) * 1.25 +
      ovrOf(mother) +
      sharedBlue * 12 +
      skillBonus -
      sharedRed * 32 -
      totalRed * 6 -
      statDiff
    );
  }

  function getSmartBreedPairs() {
    const breedAge = h => h.age >= 1 && h.age <= 4;
    const allBreedable = [...game.horses, ...game.bench];
    const allFemales = allBreedable.filter(h => h.gender === 'female' && breedAge(h));
    const allMales   = allBreedable.filter(h => h.gender === 'male'   && breedAge(h));
    const pairs = [];
    const virtualBredMales = new Set(allMales.filter(h => h.bredThisTurn).map(h => h.id));

    // 公馬主動：已完賽且未主動交配
    for (const father of allMales.filter(h => h.racedThisTurn && !virtualBredMales.has(h.id))
                                 .sort((a, b) => ovrOf(b) - ovrOf(a))) {
      if (!allFemales.length) break;
      const mother = allFemales.reduce((best, c) =>
        breedPairScore(father, c) > breedPairScore(father, best) ? c : best);
      virtualBredMales.add(father.id);
      pairs.push({ father, mother, primaryId: father.id });
    }

    // 母馬主動：已完賽的母馬各挑最佳公馬（公馬作為被選方不受 bredThisTurn 限制）
    for (const mother of allBreedable.filter(h => h.gender === 'female' && breedAge(h) && h.racedThisTurn)
                                     .sort((a, b) => ovrOf(b) - ovrOf(a))) {
      if (!allMales.length) break;
      const father = allMales.reduce((best, c) =>
        breedPairScore(c, mother) > breedPairScore(best, mother) ? c : best);
      pairs.push({ father, mother, primaryId: mother.id });
    }

    return pairs;
  }

  function buyAllMarket() {
    game.market.filter(m => m.gender === 'female').forEach(m => buyMarketHorse(m.id));
    const bestMale = [...game.market]
      .filter(m => m.gender === 'male')
      .sort((a, b) => ovrOf(b) - ovrOf(a))
      .find(m => game.money >= m.price);
    if (bestMale) buyMarketHorse(bestMale.id);
  }

  function breedAll() {
    __cardSilent = true;
    const luckyChildren = [];
    getSmartBreedPairs().forEach(({ father, mother, primaryId }) => {
      const child = breed(father.id, mother.id, primaryId);
      if (child && window.isLuckyBirth && window.isLuckyBirth(child)) luckyChildren.push(child);
    });
    __cardSilent = false;
    if (luckyChildren.length && window.openHorseCard) {
      // 一鍵交配只挑最高 OVR 的幸運兒呈現，避免卡片連發
      luckyChildren.sort((a, b) => ovrOf(b) - ovrOf(a));
      window.openHorseCard(luckyChildren[0], { reveal: true, lucky: true });
    }
  }

  function smartBuy() {
    const mktF = [...game.market].filter(m => m.gender === 'female').sort((a, b) => ovrOf(b) - ovrOf(a));
    const mktM = [...game.market].filter(m => m.gender === 'male').sort((a, b) => ovrOf(b) - ovrOf(a));
    if (!mktF.length && !mktM.length) return;

    // 足夠做完整一鍵買入？
    const allFCost = mktF.reduce((s, m) => s + m.price, 0);
    const topMale = mktM[0];
    if (game.money >= allFCost + (topMale ? topMale.price : 0)) {
      buyAllMarket();
      return;
    }

    // Greedy：優先母馬，但確保至少有一對公母可交配
    const hasMale = game.horses.some(h => h.gender === 'male' && h.age >= 1 && h.age <= 4);
    if (hasMale) {
      mktF.forEach(f => { if (game.money >= f.price) buyMarketHorse(f.id); });
    } else {
      // 需要留預算買一匹公馬
      const affordable = mktM.filter(m => m.price <= game.money).sort((a, b) => a.price - b.price);
      if (!affordable.length) {
        mktF.forEach(f => { if (game.money >= f.price) buyMarketHorse(f.id); });
        return;
      }
      const reserve = affordable[0].price;
      // 買母馬，留 reserve
      mktF.forEach(f => { if (game.money - f.price >= reserve) buyMarketHorse(f.id); });
      // 買最強公馬
      const bestM = mktM.find(m => game.money >= m.price);
      if (bestM) buyMarketHorse(bestM.id);
      // 剩餘金錢再掃母馬
      mktF.forEach(f => {
        if (game.market.some(m => m.id === f.id) && game.money >= f.price) buyMarketHorse(f.id);
      });
    }
  }

  function getOmniAction() {
    if (game.yearsElapsed >= game.maxYears) {
      return { key: 'idle', label: '終局', disabled: true };
    }
    const raceBatch = getRaceBatch();
    if (raceBatch.length) {
      return {
        key: 'race',
        label: game.currentTurnMajor ? `大典出戰 (${raceBatch.length})` : `全體出戰 (${raceBatch.length})`,
        disabled: false,
      };
    }
    const affordableCount = getAffordableMarketCount();
    if (affordableCount) {
      return { key: 'buy', label: `全體購買 (${affordableCount})`, disabled: false };
    }
    const breedPairs = getSmartBreedPairs();
    if (breedPairs.length) {
      return { key: 'breed', label: `智能交配 (${breedPairs.length})`, disabled: false };
    }
    return { key: 'idle', label: '待下一年', disabled: true };
  }

  function runOmniAction() {
    const action = getOmniAction();
    if (action.disabled) return;
    if (action.key === 'race') {
      runAllRaces();
      return;
    }
    if (action.key === 'buy') {
      smartBuy();
      return;
    }
    if (action.key === 'breed') {
      breedAll();
    }
  }

  const RANK_LABELS = ['冠軍', '亞軍', '季軍'];
  function triggerRagnarok() {
    const playerFighters = [...game.souls, ...game.horses];
    const variance = () => 0.8 + Math.random() * 0.4;
    const entries = [
      ...playerFighters.map(h => {
        const hasG01 = h.traits && h.traits.displayed.some(t => t.id === 'G01');
        let traitMult = 1.0;
        let raceAttr, raceTerrain;
        if (hasG01) {
          raceAttr = 'All'; raceTerrain = '全場地';
          const d = h.traits.displayed;
          if (d.some(t => t.id === 'B01')) traitMult += 0.08;
          if (d.some(t => t.id === 'B02')) traitMult += 0.08;
          if (d.some(t => t.id === 'B03')) traitMult += 0.08;
          if (d.some(t => t.id === 'B04')) traitMult += 0.10;
          if (d.some(t => t.id === 'B05')) traitMult += 0.10;
          if (d.some(t => t.id === 'B06')) traitMult += 0.10;
        } else {
          const rt = pick(RACE_TYPES);
          raceAttr = rt.attr; raceTerrain = rt.terrain;
          traitMult = applyTraitMultiplier(h, rt.attr, rt.terrain);
        }
        return {
          name: h.name, ovr: ovrOf(h),
          skillName: h.skill ? h.skill.name : null,
          hasG01, raceAttr, raceTerrain,
          score: Math.round(totalStats(h) * traitMult * variance()),
          isPlayer: true,
        };
      }),
      ...FOUR_KINGS.map(k => {
        const tot = k.speed + k.power + k.stamina;
        return { name: k.name, ovr: Math.round(tot / 3), skillName: null,
                 score: Math.round(tot * variance()), isPlayer: false };
      }),
    ];
    entries.sort((a, b) => b.score - a.score);
    game.ragnarok = { entries, totalPlayers: playerFighters.length };
    const best = entries.find(e => e.isPlayer);
    const rank = best ? entries.indexOf(best) + 1 : null;
    const rankLabel = rank ? (RANK_LABELS[rank - 1] || `第 ${rank} 名`) : '無人參戰';
    addLog(`⚡ RAGNARÖK · ${best ? best.name : '無馬'} 奪得${rankLabel}！`, 'soul');
    render();
  }

    document.getElementById('market-gold').textContent = `${game.money.toLocaleString()} G`;

    btn.disabled = game.yearsElapsed >= game.maxYears || blockedByChoice || inMidTurnFlow;
    btn.textContent = game.yearsElapsed >= game.maxYears ? '時辰已盡'
                    : blockedByChoice ? '請先做出選擇'

                       : blockedByChoice ? '選擇'
                       : inMidTurnFlow ? '進行中'
                       : '下一年';

    const omniAction = getOmniAction();
    const omniBtn = document.getElementById('fab-omni');
    omniBtn.textContent = omniAction.label;
    omniBtn.disabled = omniAction.disabled;
    omniBtn.className = `fab-omni state-${omniAction.key}`;

    const allRaceBtn = document.getElementById('all-race-btn');
    const eligibleCount = game.horses.filter(h => h.status === STATE_PEAK && !h.racedThisTurn).length;
    const racedCount = game.horses.filter(h => h.racedThisTurn).length;
    const majorSlots = game.currentTurnMajor ? Math.max(0, 2 - racedCount) : eligibleCount;
    const effectiveEligible = game.currentTurnMajor ? Math.min(eligibleCount, majorSlots) : eligibleCount;
    allRaceBtn.disabled = effectiveEligible === 0 || game.yearsElapsed >= game.maxYears;
    allRaceBtn.textContent = game.currentTurnMajor
      ? (majorSlots > 0 ? `大典出戰 (${effectiveEligible})` : '名額已滿')
      : (eligibleCount > 0 ? `全員出戰 (${eligibleCount})` : '全員出戰');

    const phaseBanner = document.getElementById('major-event-banner');
    if (game.yearsElapsed > 0 && game.yearsElapsed < game.maxYears + 1) {
      const subLabel = game.subPhase === 'roster' ? '〔整隊〕'
                     : game.subPhase === 'racing' ? '〔賽事〕'
                     : game.subPhase === 'breeding' ? '〔育馬〕'
                     : '';
      if (game.currentTurnPhase === 'major') {
        phaseBanner.style.display = 'block';
        phaseBanner.textContent = `⚡ 大典 ${subLabel} · 賽事獎金加倍、勝者獲賜技能與印記`;
      } else if (game.currentTurnPhase === 'race') {
        phaseBanner.style.display = 'block';
        phaseBanner.textContent = `🏇 小賽事 ${subLabel} · 全員出戰賺取黃金`;
      } else {
        phaseBanner.style.display = 'block';
        phaseBanner.textContent = '✨ 活動 · 三選一獎勵';
      }
    } else {
      phaseBanner.style.display = 'none';
    }

    const venueCard = document.getElementById('race-venue-card');
    if (game.currentRace && game.yearsElapsed > 0 && game.yearsElapsed < game.maxYears + 1) {
      const r = game.currentRace;
      venueCard.style.display = 'block';
      document.getElementById('venue-name').textContent = r.name;
      const attrEl = document.getElementById('venue-attr');
      attrEl.textContent = ATTR_LABEL[r.attr] || r.attr;
      attrEl.className = 'attr-badge attr-' + r.attr;
      document.getElementById('venue-terrain').textContent = r.terrain;
      const hintMap = {
        Fire: '帶 B01 火足 +8%',
        Ice:  '帶 B02 長毛 +8%',
        Sand: '帶 B03 駱駝 +8%',
      };
      const terrainHintMap = {
        '爬山':     '帶 B04 神山 +10%',
        '長平原':   '帶 B05 GTR +10%',
        '起伏不定': '帶 B06 越野 +10%',
      };
      const hints = [hintMap[r.attr], terrainHintMap[r.terrain]].filter(Boolean);
      const hintEl = document.getElementById('venue-hint');
      hintEl.textContent = hints.length ? '相性：' + hints.join(' · ') : '';
      hintEl.style.display = hints.length ? 'block' : 'none';
    } else {
      venueCard.style.display = 'none';
    }

    // Body class for phase lock
    document.body.classList.remove('subphase-event','subphase-roster','subphase-racing','subphase-breeding','phase-end','phase-init');
    if (game.yearsElapsed >= game.maxYears) {
      document.body.classList.add('phase-end');
    } else if (game.yearsElapsed === 0) {
      document.body.classList.add('phase-init');
    } else if (game.currentTurnPhase === 'event') {
      document.body.classList.add('subphase-event');
    } else if (game.subPhase) {
      document.body.classList.add('subphase-' + game.subPhase);
    }
    // 進入 breeding 自動展開資訊欄看交配 / 黑市
    if (game.subPhase === 'breeding' && !game.infoDrawerOpen) {
      game.infoDrawerOpen = true;
    }

    const smartPairs = getSmartBreedPairs();
    const infoToggle = document.getElementById('info-toggle');
    const infoDrawer = document.getElementById('info-drawer');
    infoToggle.classList.toggle('open', game.infoDrawerOpen);
    infoToggle.setAttribute('aria-expanded', String(game.infoDrawerOpen));
    infoDrawer.classList.toggle('open', game.infoDrawerOpen);
    document.getElementById('info-toggle-state').textContent = game.infoDrawerOpen ? '收起' : '展開';
    document.getElementById('info-toggle-sub').textContent =
      `播報 ${game.races.length} · 黑市 ${game.market.length} · 交配 ${smartPairs.length} · 紀錄 ${game.log.length}`;

    const feed = document.getElementById('race-feed');
    if (!game.races.length) {
      feed.innerHTML = `<div class="race-empty">尚未開戰，遣巔峰馬出戰即可賺取黃金。</div>`;
    } else {
      feed.innerHTML = game.races.map(r => `
        <div class="race-entry ${r.won ? 'win' : 'loss'}${r.isMajor ? ' major' : ''}">
          <span class="race-year">${r.isMajor ? '⚡ ' : ''}第 ${r.year / 1000} 年${r.raceType ? ' · ' + r.raceType : ''}${r.raceAttr ? ` <span class="attr-badge attr-${r.raceAttr}">${ATTR_LABEL[r.raceAttr]||r.raceAttr}</span>` : ''}${r.raceTerrain ? `<span class="terrain-badge">${r.raceTerrain}</span>` : ''}</span>
          <span class="race-matchup">
            <span class="player">${r.player.name}</span><span class="score">[${r.player.score}]</span>
            <span class="vs">VS</span>
            <span class="enemy">${r.enemy.name}</span><span class="score">[${r.enemy.score}]</span>
          </span>
          <span class="race-verdict ${r.won ? 'win' : 'loss'}">${r.won ? '勝' : '敗'}</span>
          <span class="race-reward ${r.won ? 'win' : 'loss'}">+${r.reward}G</span>
        </div>
      `).join('');
    }

    // 育種：主動方需參賽過；被選方（secondary）無限制
    const breedAge = h => h.age >= 1 && h.age <= 4;
    const allBreedable = [...game.horses, ...game.bench];
    // primary 候選：參賽過，公馬需未主動配過
    const primaryEligible = h => breedAge(h) && h.racedThisTurn && !(h.gender === 'male' && h.bredThisTurn);
    const allPrimary = allBreedable.filter(primaryEligible);
    // secondary 候選：年齡符合即可（替補、未參賽、已配皆可）
    const allSecondaryPool = (gender) => allBreedable.filter(h => h.gender === gender && breedAge(h));
    // 清除失效的選擇
    if (!allPrimary.find(h => h.id === game.breedPrimaryId)) game.breedPrimaryId = null;
    if (game.breedPrimaryId === null) game.breedSecondaryId = null;
    const primary = allPrimary.find(h => h.id === game.breedPrimaryId) || null;
    const oppositeGender = primary ? (primary.gender === 'male' ? 'female' : 'male') : null;
    const secondaryPool = oppositeGender ? allSecondaryPool(oppositeGender) : [];
    if (!secondaryPool.find(h => h.id === game.breedSecondaryId)) game.breedSecondaryId = null;
    const secondary = secondaryPool.find(h => h.id === game.breedSecondaryId) || null;
    const father = primary?.gender === 'male' ? primary : secondary;
    const mother = primary?.gender === 'female' ? primary : secondary;

    const breedCardHtml = (h, isPrimary) => {
      const sel = isPrimary ? game.breedPrimaryId === h.id : game.breedSecondaryId === h.id;
      // primary：公馬已主動交配過則 disabled；secondary：任何人都可選，無 disabled
      const disabledCard = isPrimary && h.gender === 'male' && h.bredThisTurn;
      const cls = `breed-card${sel ? ' selected' : ''}${disabledCard ? ' disabled' : ''}`;
      const bredTag = h.bredThisTurn ? '已配' : `${h.age}歲`;
      const ageTag = isPrimary ? bredTag : (h.racedThisTurn ? `${h.age}歲` : `${h.age}歲・未賽`);
      const benchTag = game.bench.some(b => b.id === h.id) ? ` <span style="opacity:.5;font-size:9px">替補</span>` : '';
      return `
        <div class="${cls}" data-bid="${h.id}" data-step="${isPrimary ? 'primary' : 'secondary'}">
          <div class="breed-card-main">
            <div class="breed-card-name">${h.name}${h.skill ? ` <span class="skill-badge">${h.skill.name}</span>` : ''}${benchTag}</div>
            <div class="breed-card-stats">速${h.speed}・力${h.power}・體${h.stamina}・<span class="${h.gender}">${h.gender === 'male' ? '公' : '母'}</span></div>
          </div>
          <div style="text-align:right">
            <div class="breed-card-ovr">${ovrOf(h)}</div>
            <div class="breed-card-age">${ageTag}</div>
          </div>
        </div>`;
    };

    const primaryListEl   = document.getElementById('breed-primary-list');
    const secondaryListEl = document.getElementById('breed-secondary-list');
    const step2El = document.getElementById('breed-step2');
    const step2Title = document.getElementById('breed-step2-title');
    // 第一步：已完賽馬匹（公馬未主動配過）
    primaryListEl.innerHTML = allPrimary.length
      ? allPrimary.map(h => breedCardHtml(h, true)).join('')
      : `<div class="breed-empty">無已完賽馬匹可交配</div>`;
    // 第二步：選定主動方後才啟用；被選方無參賽限制
    if (!primary) {
      step2El.style.opacity = '0.35';
      step2El.style.pointerEvents = 'none';
      step2Title.textContent = '選擇配對對象';
      secondaryListEl.innerHTML = `<div class="breed-empty">請先選擇第一匹馬</div>`;
    } else {
      step2El.style.opacity = '';
      step2El.style.pointerEvents = '';
      step2Title.textContent = `配對對象（${primary.gender === 'male' ? '母馬' : '公馬'}）`;
      secondaryListEl.innerHTML = secondaryPool.length
        ? secondaryPool.map(h => breedCardHtml(h, false)).join('')
        : `<div class="breed-empty">無${primary.gender === 'male' ? '母馬' : '公馬'}可配對</div>`;
    }

    const breedBtnEl = document.getElementById('breed-btn');
    const pairEl = document.getElementById('breed-pair-display');
    pairEl.innerHTML = (father && mother)
      ? `<span class="pair-name">${father.name}</span><span class="pair-x">×</span><span class="pair-name">${mother.name}</span>`
      : `<span style="opacity:.5">— 先選第一匹，再選配對對象 —</span>`;
    breedBtnEl.disabled = !(father && mother);
    document.getElementById('breed-all-btn').disabled = !smartPairs.length;
    document.getElementById('breed-all-btn').textContent = smartPairs.length ? `智能交配 (${smartPairs.length})` : '智能交配';

    const vetBlock = document.getElementById('vet-advice-block');
    if (father && mother) {
      const advice = getVetAdvice(father, mother);
      vetBlock.style.display = '';
      vetBlock.className = `vet-advice${advice.sev ? ' sev-' + advice.sev : ''}`;
      vetBlock.innerHTML = `<div class="vet-name">🩺 瓦 拉 克 博 士 · 建 言</div><div class="vet-text">${advice.text.replace(/\n/g, '<br>')}</div>`;
    } else {
      vetBlock.style.display = 'none';
    }

    const buyAllBtn = document.getElementById('buy-all-market-btn');
    const affordableCount = getAffordableMarketCount();
    buyAllBtn.disabled = affordableCount === 0;
    buyAllBtn.textContent = affordableCount ? `全體購買 (${affordableCount})` : '全體購買';

    const marketList = document.getElementById('market-list');
    if (!game.market.length) {
      marketList.innerHTML = `<div class="empty">黑市清空，待下一年補貨。</div>`;
    } else {
      marketList.innerHTML = game.market.map(m => `
        <div class="market-card">
          <div class="horse-info">
            <div class="horse-name-row">
              <span class="horse-name">${m.name}</span>
              <span class="gender ${m.gender}">${m.gender === 'male' ? '公' : '母'}</span>
            </div>
            <div class="stats-row">
              <span class="stat-pill">速度 <strong>${m.speed}</strong></span>
              <span class="stat-pill">力量 <strong>${m.power}</strong></span>
              <span class="stat-pill">體力 <strong>${m.stamina}</strong></span>
            </div>
          </div>
          <div class="market-meta">
            <span class="ovr">OVR ${ovrOf(m)}</span>
            <span class="price">${m.price.toLocaleString()} G</span>
            <span class="status ${m.status}">${STATE_LABEL[m.status] || ''} ${m.age}歲</span>
          </div>
          <button class="buy-btn" data-mid="${m.id}" ${game.money < m.price ? 'disabled' : ''}>${game.money < m.price ? '黃金不足' : '購入'}</button>
        </div>
      `).join('');
    }

    const list = document.getElementById('horse-list');
    if (!game.horses.length) {
      list.innerHTML = `<div class="empty">馬廄空無一物。</div>`;
    } else {
      const sorted = [...game.horses].sort((a, b) => ovrOf(b) - ovrOf(a));
      const showAll = game.stableExpanded || sorted.length <= 5;
      const visible = showAll ? sorted : sorted.slice(0, 5);
      const hiddenCount = sorted.length - visible.length;

      const majorFull = game.currentTurnMajor && game.horses.filter(h => h.racedThisTurn).length >= 2;
      const cards = visible.map(h => {
        const mut = h.mutated || {};
        const raceBtn = h.status === STATE_PEAK
          ? `<button class="race-btn" data-id="${h.id}" ${(h.racedThisTurn || majorFull) ? 'disabled' : ''}>${h.racedThisTurn ? '已參賽' : majorFull ? '名額已滿' : '參加賽事'}</button>`
          : '';
        const swapBtn = `<button class="roster-swap-btn demote" data-bench-id="${h.id}">下放替補 ▾</button>`;
        const eSpd = effectiveStat(h, 'speed'), ePow = effectiveStat(h, 'power'), eSta = effectiveStat(h, 'stamina');
        const traitBadges = h.traits ? h.traits.displayed.map(t => {
          const td = TRAIT_DATA[t.id];
          return td ? `<span class="trait-badge ${t.type}" data-tooltip="${td.desc}">${td.name}</span>` : '';
        }).join('') : '';
        const markBadges = (h.marks || []).map(m => {
          const md = MARK_DATA[m.id];
          return md ? `<span class="mark-badge" data-tooltip="${md.desc}">★ ${md.name}</span>` : '';
        }).join('');
        const recessiveWarn = h.traits && h.traits.recessiveFlags.length
          ? `<span class="trait-warning">⚠ 不詳因子</span>` : '';
        const recessiveMarkWarn = (h.marksRecessive && h.marksRecessive.length)
          ? `<span class="trait-warning">★ 印記血脈</span>` : '';
        const rarityId = (typeof window.rarityOf === 'function') ? window.rarityOf(h).id : '';
        const ageDim = h.status !== STATE_PEAK ? 'dim' : '';
        return `
          <div class="horse-card" data-id="${h.id}"${rarityId ? ` data-rarity="${rarityId}"` : ''}>
            <div class="horse-info">
              <div class="horse-name-row">
                <span class="horse-name">${h.name}</span>
                <span class="gender ${h.gender}">${h.gender === 'male' ? '公' : '母'}</span>
              </div>
              <div class="stats-row">
                <span class="stat-pill ${mut.speed ? 'mut' : eSpd > h.speed ? 'boosted' : ''}">速度 <strong>${eSpd}</strong></span>
                <span class="stat-pill ${mut.power ? 'mut' : ePow > h.power ? 'boosted' : ''}">力量 <strong>${ePow}</strong></span>
                <span class="stat-pill ${mut.stamina ? 'mut' : eSta > h.stamina ? 'boosted' : ''}">體力 <strong>${eSta}</strong></span>
              </div>
              ${(traitBadges || markBadges || recessiveWarn || recessiveMarkWarn) ? `<div class="trait-row">${markBadges}${traitBadges}${recessiveWarn}${recessiveMarkWarn}</div>` : ''}
            </div>
            <div class="horse-meta">
              <span class="ovr">OVR ${ovrOf(h)}</span>
              ${h.skill ? `<span class="skill-badge">${h.skill.name}</span>` : ''}
              <span class="age ${ageDim}">${h.age} 歲</span>
            </div>
            ${raceBtn}
            ${swapBtn}
          </div>
        `;
      }).join('');

      const toggle = sorted.length > 5
        ? `<button class="stable-toggle" id="stable-toggle">${game.stableExpanded ? '‹ 收合' : `› 展開（隱藏 ${hiddenCount} 匹）`}</button>`
        : '';

      list.innerHTML = cards + toggle;
    }

    // Bench list
    const benchListEl = document.getElementById('bench-list');
    const benchCapEl = document.getElementById('bench-cap');
    if (benchCapEl) benchCapEl.textContent = `${game.bench.length} 匹`;
    if (benchListEl) {
      if (!game.bench.length) {
        benchListEl.innerHTML = `<div class="bench-empty">替補席尚無馬匹。</div>`;
      } else {
        const sortedBench = [...game.bench].sort((a, b) => ovrOf(b) - ovrOf(a));
        const activeFull = game.horses.length >= game.stableSize;
        benchListEl.innerHTML = sortedBench.map(h => {
          const mut = h.mutated || {};
          const eSpd = effectiveStat(h, 'speed'), ePow = effectiveStat(h, 'power'), eSta = effectiveStat(h, 'stamina');
          const traitBadges = h.traits ? h.traits.displayed.map(t => {
            const td = TRAIT_DATA[t.id];
            return td ? `<span class="trait-badge ${t.type}" data-tooltip="${td.desc}">${td.name}</span>` : '';
          }).join('') : '';
          const markBadges = (h.marks || []).map(m => {
            const md = MARK_DATA[m.id];
            return md ? `<span class="mark-badge" data-tooltip="${md.desc}">★ ${md.name}</span>` : '';
          }).join('');
          const recessiveWarn = h.traits && h.traits.recessiveFlags.length
            ? `<span class="trait-warning">⚠ 不詳因子</span>` : '';
          const rarityId = (typeof window.rarityOf === 'function') ? window.rarityOf(h).id : '';
          return `
            <div class="horse-card" data-id="${h.id}"${rarityId ? ` data-rarity="${rarityId}"` : ''} style="opacity:.85">
              <div class="horse-info">
                <div class="horse-name-row">
                  <span class="horse-name">${h.name}</span>
                  <span class="gender ${h.gender}">${h.gender === 'male' ? '公' : '母'}</span>
                </div>
                <div class="stats-row">
                  <span class="stat-pill ${mut.speed ? 'mut' : ''}">速度 <strong>${eSpd}</strong></span>
                  <span class="stat-pill ${mut.power ? 'mut' : ''}">力量 <strong>${ePow}</strong></span>
                  <span class="stat-pill ${mut.stamina ? 'mut' : ''}">體力 <strong>${eSta}</strong></span>
                </div>
                ${(traitBadges || markBadges || recessiveWarn) ? `<div class="trait-row">${markBadges}${traitBadges}${recessiveWarn}</div>` : ''}
              </div>
              <div class="horse-meta">
                <span class="ovr">OVR ${ovrOf(h)}</span>
                ${h.skill ? `<span class="skill-badge">${h.skill.name}</span>` : ''}
                <span class="age dim">${h.age} 歲</span>
              </div>
              <button class="roster-swap-btn promote" data-roster-id="${h.id}" ${activeFull ? 'disabled' : ''}>${activeFull ? '先發已滿' : '上場 ▴'}</button>
            </div>
          `;
        }).join('');
      }
    }

    // Roster advance button only valid in roster sub-phase
    const rosterBtn = document.getElementById('advance-roster-btn');
    if (rosterBtn) rosterBtn.disabled = game.subPhase !== 'roster';

    const logEl = document.getElementById('log');
    logEl.innerHTML = game.log
      .map(l => `<div class="log-entry ${l.kind}">› ${l.text}</div>`)
      .join('');

    const ragBanner = document.getElementById('ragnarok-banner');
    if (game.ragnarok) {
      ragBanner.style.display = 'block';
      const { entries, totalPlayers } = game.ragnarok;
      const best = entries.find(e => e.isPlayer);
      const rank = best ? entries.indexOf(best) + 1 : null;
      const rankLabel = rank ? (RANK_LABELS[rank - 1] || `第 ${rank} 名`) : '無人參戰';
      const rows = entries.map((e, i) => {
        const rl = RANK_LABELS[i] || `${i + 1}`;
        const terrainTag = e.isPlayer && e.raceAttr
          ? ` <span class="attr-badge attr-${e.raceAttr}">${ATTR_LABEL[e.raceAttr]||e.raceAttr}</span><span class="terrain-badge">${e.raceTerrain}</span>`
          : '';
        return `<div class="rag-rank-row${e.isPlayer ? ' player' : ''}" style="animation-delay:${i * 0.1}s">
          <span class="rag-rank-num">${rl}</span>
          <span class="rag-rank-name">${e.name}${e.skillName ? ` ·${e.skillName}` : ''}${terrainTag}</span>
          <span class="rag-rank-ovr">OVR ${e.ovr}</span>
          <span class="rag-rank-score">[${e.score}]</span>
        </div>`;
      }).join('');
      ragBanner.innerHTML = `
        <div class="ragnarok-title">⚡ RAGNARÖK</div>
        <div class="ragnarok-champion">${best ? `${rankLabel} · ${best.name}（OVR ${best.ovr}）` : '無人參戰'}</div>
        <div class="ragnarok-battles">${rows}</div>
        <div class="ragnarok-sub">${totalPlayers} 匹靈魂與現役 · 挑戰四天王</div>
      `;
    } else if (game.yearsElapsed >= game.maxYears) {
      ragBanner.style.display = 'block';
      ragBanner.innerHTML = `
        <div class="ragnarok-title">⚡ RAGNARÖK</div>
        <div class="ragnarok-sub">三萬年已終，是時候決一死戰。</div>
        <button class="primary" id="enter-ragnarok-btn" style="margin-top:18px;letter-spacing:.2em">進入終局</button>
      `;
    } else {
      ragBanner.style.display = 'none';
    }

    const capEl = document.getElementById('stable-cap');
    if (capEl) {
      const full = game.horses.length >= game.stableSize;
      capEl.textContent = `${game.horses.length} / ${game.stableSize}`;
      capEl.classList.toggle('full', full);
    }

    renderChoiceModal();
  }

  function renderChoiceModal() {
    const overlay = document.getElementById('choice-modal');
    const titleEl = document.getElementById('choice-modal-title');
    const cardsEl = document.getElementById('choice-cards');
    if (!game.pendingChoice) {
      overlay.classList.remove('open');
      return;
    }
    const { kind, cards, context } = game.pendingChoice;
    if (kind === 'event') {
      titleEl.textContent = '活 動 · 三 選 一';
    } else if (kind === 'mark') {
      const horse = game.horses.find(h => h.id === context.horseId);
      titleEl.textContent = horse ? `印 記 賜 予 · ${horse.name}` : '印 記 賜 予';
    }
    cardsEl.innerHTML = cards.map((c, i) => {
      let target = '';
      if (c.kind === 'trait') {
        const candidate = game.horses
          .filter(h => h.traits && !h.traits.displayed.some(t => t.id === c.traitId))
          .sort((a, b) => ovrOf(b) - ovrOf(a))[0];
        target = candidate ? `→ 將施加於 ${candidate.name}` : '→ 無對象（將浪費）';
      } else if (c.kind === 'marketBuff') {
        target = '→ 影響下一年的黑市';
      } else if (c.kind === 'gold') {
        target = `→ +${c.amount}G`;
      } else if (c.kind === 'mark') {
        target = '→ 永久印記，A 型隱性遺傳';
      }
      const kindLabel = c.kind === 'mark' ? '印記' : c.kind === 'trait' ? '藍特' : c.kind === 'marketBuff' ? '黑市' : '即時';
      return `
        <div class="choice-card" data-idx="${i}">
          <div class="choice-card-kind">${kindLabel}</div>
          <div class="choice-card-title">${c.title}</div>
          <div class="choice-card-desc">${c.desc}</div>
          <div class="choice-card-target">${target}</div>
        </div>
      `;
    }).join('');
    overlay.classList.add('open');
  }

  function pickChoiceCard(idx) {
    if (!game.pendingChoice) return;
    const card = game.pendingChoice.cards[idx];
    if (!card) return;
    if (game.pendingChoice.kind === 'event') {
      applyChoiceCard(card);
    } else if (game.pendingChoice.kind === 'mark') {
      const horse = game.horses.find(h => h.id === game.pendingChoice.context.horseId);
      if (horse) awardMark(horse, card.markId);
    }
    resolvePending();
    render();
  }

  document.getElementById('fab-next').addEventListener('click', nextTurn);
  document.getElementById('fab-omni').addEventListener('click', runOmniAction);
  document.getElementById('next-turn').addEventListener('click', nextTurn);
  document.getElementById('info-toggle').addEventListener('click', () => {
    game.infoDrawerOpen = !game.infoDrawerOpen;
    render();
  });
  document.getElementById('all-race-btn').addEventListener('click', runAllRaces);
  document.getElementById('anim-toggle-btn').addEventListener('click', () => {
    game.settings.animationsEnabled = !game.settings.animationsEnabled;
    const btn = document.getElementById('anim-toggle-btn');
    btn.textContent = game.settings.animationsEnabled ? '▶ 動畫 ON' : '⏭ 動畫 OFF';
  });
  document.getElementById('horse-list').addEventListener('click', (e) => {
    const raceBtn = e.target.closest('.race-btn');
    if (raceBtn && !raceBtn.disabled) {
      runRace(raceBtn.dataset.id);
      return;
    }
    const demoteBtn = e.target.closest('.roster-swap-btn.demote');
    if (demoteBtn) {
      moveToBench(demoteBtn.dataset.benchId);
      return;
    }
    const toggle = e.target.closest('.stable-toggle');
    if (toggle) {
      game.stableExpanded = !game.stableExpanded;
      render();
    }
  });
  document.getElementById('bench-list').addEventListener('click', (e) => {
    const promoteBtn = e.target.closest('.roster-swap-btn.promote');
    if (promoteBtn && !promoteBtn.disabled) {
      moveToRoster(promoteBtn.dataset.rosterId);
    }
  });
  document.getElementById('advance-roster-btn').addEventListener('click', advanceFromRoster);
  document.getElementById('buy-all-market-btn').addEventListener('click', smartBuy);
  document.getElementById('market-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.buy-btn');
    if (!btn || btn.disabled) return;
    buyMarketHorse(btn.dataset.mid);
  });
  function handleBreedListClick(e) {
    const card = e.target.closest('.breed-card');
    if (!card || card.classList.contains('disabled')) return;
    const id = card.dataset.bid;
    const step = card.dataset.step;
    if (step === 'primary') {
      game.breedPrimaryId = (game.breedPrimaryId === id) ? null : id;
      if (!game.breedPrimaryId) game.breedSecondaryId = null;
    } else if (step === 'secondary') {
      game.breedSecondaryId = (game.breedSecondaryId === id) ? null : id;
    }
    render();
  }
  document.getElementById('breed-primary-list').addEventListener('click', handleBreedListClick);
  document.getElementById('breed-secondary-list').addEventListener('click', handleBreedListClick);

  document.getElementById('breed-btn').addEventListener('click', () => {
    const allBreedable = [...game.horses, ...game.bench];
    const primary = allBreedable.find(h => h.id === game.breedPrimaryId);
    const secondary = allBreedable.find(h => h.id === game.breedSecondaryId);
    if (!primary || !secondary) return;
    const fatherId = primary.gender === 'male' ? primary.id : secondary.id;
    const motherId = primary.gender === 'female' ? primary.id : secondary.id;
    breed(fatherId, motherId, primary.id);
    game.breedSecondaryId = null; // 清除配對對象；保留第一匹方便連配
  });
  document.getElementById('breed-all-btn').addEventListener('click', breedAll);

  document.getElementById('ragnarok-banner').addEventListener('click', (e) => {
    if (e.target.id === 'enter-ragnarok-btn') triggerRagnarok();
  });

  document.getElementById('choice-modal').addEventListener('click', (e) => {
    const card = e.target.closest('.choice-card');
    if (!card) return;
    pickChoiceCard(parseInt(card.dataset.idx, 10));
  });

  // 馬匹清單 modal
  let modalTab = 'active';
  function traitBadgesHtml(horse) {
    if (!horse.traits) return '';
    const badges = horse.traits.displayed.map(t => {
      const td = TRAIT_DATA[t.id];
      return td ? `<span class="trait-badge ${t.type}" data-tooltip="${td.desc}">${td.name}</span>` : '';
    }).join('');
    const warn = horse.traits.recessiveFlags.length
      ? `<span class="trait-warning">⚠ 不詳因子</span>` : '';
    return badges + warn;
  }
  function renderModal() {
    document.querySelectorAll('.modal-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === modalTab));
    const body = document.getElementById('modal-body');
    if (modalTab === 'pool') {
      body.innerHTML = `<div class="modal-empty">育種資料庫尚未開放（Stage C-4 待實作）</div>`;
      return;
    }
    const list = modalTab === 'active'
      ? [...game.horses].sort((a, b) => ovrOf(b) - ovrOf(a))
      : [...game.souls].sort((a, b) => ovrOf(b) - ovrOf(a));
    if (!list.length) {
      body.innerHTML = `<div class="modal-empty">${modalTab === 'active' ? '馬廄空無一物。' : '靈魂區空無一物。'}</div>`;
      return;
    }
    body.innerHTML = `<div class="modal-horse-list">${list.map(h => `
      <div class="modal-horse-row" data-id="${h.id}">
        <div class="modal-horse-info">
          <div class="modal-horse-name">
            ${h.name}
            <span class="gender ${h.gender}">${h.gender === 'male' ? '公' : '母'}</span>
            ${h.skill ? `<span class="skill-badge">${h.skill.name}</span>` : ''}
          </div>
          <div class="modal-horse-sub">${h.age}歲 · 速${effectiveStat(h,'speed')} 力${effectiveStat(h,'power')} 體${effectiveStat(h,'stamina')}</div>
          <div class="trait-row" style="margin-top:5px">${traitBadgesHtml(h)}</div>
        </div>
        <div class="modal-horse-ovr">OVR ${ovrOf(h)}</div>
      </div>
    `).join('')}</div>`;
  }
  document.getElementById('roster-btn').addEventListener('click', () => {
    document.getElementById('horse-modal').classList.add('open');
    renderModal();
  });
  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('horse-modal').classList.remove('open');
  });
  document.getElementById('horse-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('horse-modal'))
      document.getElementById('horse-modal').classList.remove('open');
  });
  document.querySelectorAll('.modal-tab').forEach(tab => {
    tab.addEventListener('click', () => { modalTab = tab.dataset.tab; renderModal(); });
  });

  init();

  // 主按鈕可見時隱藏右下角 FAB
  const fabNext = document.getElementById('fab-next');
  const mainBtn = document.getElementById('next-turn');
  new IntersectionObserver(([entry]) => {
    fabNext.classList.toggle('hidden', entry.isIntersecting);
  }, { threshold: 0.5 }).observe(mainBtn);
</script>
  <div id="race-anim-overlay" class="race-anim-overlay">
    <div class="race-anim-box">
      <div class="race-anim-header" id="race-anim-header"></div>
      <div class="race-anim-track"  id="race-anim-track"></div>
      <div class="race-anim-events" id="race-anim-events"></div>
      <div class="race-anim-controls">
        <span id="race-anim-result"></span>
        <button class="race-skip-btn" id="race-skip-btn">跳過 ▶▶</button>
      </div>
    </div>
  </div>

</body>
